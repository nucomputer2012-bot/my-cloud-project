  <button data-page="help">🤝<br>ช่วยเหลือ</button>

<script>
const DEFAULT_API = "";
const DEFAULT_COMMUNITIES = [];
const DEFAULT_TYPES = ["พิการ","ผู้ป่วยติดเตียง","ผู้สูงอายุ","ฐานะยากลำบาก"];
const DEFAULT_HELPS = ["ถุงยังชีพ","อุปกรณ์การแพทย์","หน่วยงานอื่นๆ"];
const DEFAULT_HEADER = "ระบบจัดการข้อมูลผู้ขอรับความช่วยเหลือในชุมชน • หมู่10 ตำบลบางคูวัด อำเภอเมือง จังหวัดปทุมธานี";
const DEFAULT_NAME = "Community Care Version 1.0";
const DB_NAME="CommunityCareDB", DB_VERSION=1;
let settings={apiUrl:"",communities:[],types:DEFAULT_TYPES.slice(),helps:DEFAULT_HELPS.slice(),brandName:DEFAULT_NAME,brandSub:DEFAULT_HEADER,configured:false,cloudEnabled:false,theme:"light",folderName:"",auth:null};
let API_URL="", communities=DEFAULT_COMMUNITIES.slice(), types=DEFAULT_TYPES.slice(), helps=DEFAULT_HELPS.slice();
let people=[], help=[], statuses=[], page="home", editId=null, db=null, dbReady=false, isConfigured=false, selectedFolderName="";
let authenticated=false;
let authMode="login";
let authChallengeBusy=false;

function setCloudStatus(message){
  const text=String(message||"");
  const el=document.getElementById("cloudStatus");
  if(el) el.textContent=text;
  const side=document.getElementById("sidebarStatusText");
  if(side) side.textContent=text.replace(/\s+•\s+/g," • ");
}

function updateHeaderUI(){
  document.getElementById("brandTitle").textContent = settings.brandName || DEFAULT_NAME;
  document.getElementById("brandSub").textContent = settings.brandSub || DEFAULT_HEADER;
}

function toggleTheme() {
  const root = document.documentElement;
  const btn = document.getElementById("themeToggle");
  if(root.getAttribute("data-theme") === "dark") {
    root.removeAttribute("data-theme");
    settings.theme="light"; persistSettings();
    if(btn) btn.textContent = "🌙 โหมดมืด";
  } else {
    root.setAttribute("data-theme", "dark");
    settings.theme="dark"; persistSettings();
    if(btn) btn.textContent = "☀️ โหมดสว่าง";
  }
}

document.addEventListener("DOMContentLoaded", async () => {
  try {
    await initDB();
    await loadSettings();
    // การเปิดระบบครั้งแรกจะยังไม่ถือ IndexedDB เป็นฐานข้อมูลหลัก
    // แหล่งข้อมูลหลักต้องเป็นแหล่งที่ผู้ใช้ยืนยันในการตั้งค่าครั้งแรกเท่านั้น
    if(isConfigured && settings.cloudEnabled && settings.apiUrl){
      people=[]; help=[]; statuses=[];
      const ok=await loadCloud(true);
      if(!ok){
        // เก็บค่าการตั้งค่าเดิมไว้ แต่ไม่ถือว่าระบบพร้อมใช้งานจนกว่าจะเชื่อมต่อสำเร็จ
        isConfigured=false;
        setCloudStatus("⚠️ เชื่อมต่อ Cloud ไม่สำเร็จ • กรุณาตรวจสอบการตั้งค่า");
      }
    }else if(isConfigured && settings.folderHandle){
      people=[]; help=[]; statuses=[];
      const ok=await loadFolderData(false);
      if(!ok){
        // สำคัญ: ห้ามลบสถานะการตั้งค่าของเครื่องเพียงเพราะ Browser ยังไม่อนุญาต
        // File System Access ในการเปิดหน้าเว็บอัตโนมัติ (ต้องเกิดจาก user gesture)
        await loadLocalData();
        setCloudStatus("⚠️ Offline • ต้องอนุญาตโฟลเดอร์เมื่อพร้อมใช้งาน");
      }
    }else if(isConfigured){
      // การตั้งค่าถูกเก็บไว้ในเครื่องแล้ว แม้ไม่มี folderHandle ให้ถือว่ายังเป็นเครื่องเดิม
      // และใช้ IndexedDB เป็นข้อมูลชั่วคราวจนกว่าจะเลือก/เชื่อมโฟลเดอร์อีกครั้ง
      await loadLocalData();
      setCloudStatus("📱 Offline • การตั้งค่าเดิมของเครื่องถูกเก็บไว้แล้ว");
    }else{
      people=[]; help=[]; statuses=[];
    }
    updateHeaderUI();
    updateModeUI();
    authenticated=!isConfigured;
    render();
    if(isConfigured){
      authenticated=false;
      showLoginGate();
    }
  } catch(e){ console.error(e); alert("ไม่สามารถเปิดฐานข้อมูลได้: "+e.message); }
});

function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains("settings"))d.createObjectStore("settings",{keyPath:"key"});if(!d.objectStoreNames.contains("people"))d.createObjectStore("people",{keyPath:"id"});if(!d.objectStoreNames.contains("help"))d.createObjectStore("help",{keyPath:"id"});if(!d.objectStoreNames.contains("statuses"))d.createObjectStore("statuses",{keyPath:"id"});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error("เปิด IndexedDB ไม่สำเร็จ"));});}
async function initDB(){db=await openDB();dbReady=true;}
function store(n,m="readonly"){return db.transaction(n,m).objectStore(n)}
function idbPut(n,v){return new Promise((res,rej)=>{let r=store(n,"readwrite").put(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function idbGet(n,k){return new Promise((res,rej)=>{let r=store(n).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbAll(n){return new Promise((res,rej)=>{let r=store(n).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function idbClear(n){return new Promise((res,rej)=>{let r=store(n,"readwrite").clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
const DEVICE_CONFIG_KEY="communityCareDeviceConfigV1";
function getDeviceConfig(){try{return JSON.parse(localStorage.getItem(DEVICE_CONFIG_KEY)||"null")}catch(e){return null}}
function saveDeviceConfig(){try{const c={configured:!!settings.configured,cloudEnabled:!!settings.cloudEnabled,apiUrl:settings.apiUrl||"",folderName:settings.folderName||"",theme:settings.theme||"light",brandName:settings.brandName||DEFAULT_NAME,brandSub:settings.brandSub||DEFAULT_HEADER,communities:settings.communities||DEFAULT_COMMUNITIES.slice(),types:settings.types||DEFAULT_TYPES.slice(),helps:settings.helps||DEFAULT_HELPS.slice(),savedAt:new Date().toISOString()};localStorage.setItem(DEVICE_CONFIG_KEY,JSON.stringify(c))}catch(e){console.warn("saveDeviceConfig",e)}}
async function persistSettings(){if(dbReady)await idbPut("settings",{key:"app",value:settings});saveDeviceConfig()}
async function loadSettings(){const x=await idbGet("settings","app");if(x?.value)settings=Object.assign(settings,x.value);settings.communities=Array.isArray(settings.communities)?settings.communities.map(v=>String(v).trim()).filter(Boolean):[];if(settings.brandName==="Community Care Version 1.0 Offline"){settings.brandName=DEFAULT_NAME;try{await idbPut("settings",{key:"app",value:settings})}catch(e){console.warn("migrate brandName",e)}}const device=getDeviceConfig();if(device?.configured && !settings.configured)settings=Object.assign(settings,device);isConfigured=!!settings.configured;API_URL=settings.cloudEnabled?settings.apiUrl||"":"";communities=settings.communities?.length?settings.communities:DEFAULT_COMMUNITIES.slice();types=settings.types?.length?settings.types:DEFAULT_TYPES.slice();helps=settings.helps?.length?settings.helps:DEFAULT_HELPS.slice();selectedFolderName=settings.folderName||"";if(settings.auth&&typeof settings.auth==="object"){settings.auth.email=String(settings.auth.email||"").trim().toLowerCase();settings.auth.salt=String(settings.auth.salt||"");settings.auth.hash=String(settings.auth.hash||"")}else settings.auth=null;if(settings.theme==="dark")document.documentElement.setAttribute("data-theme","dark")}
async function loadLocalData(){people=await idbAll("people");help=await idbAll("help");statuses=await idbAll("statuses")}
const DATA_FILE_NAME="community-care-data.json";
async function getStoredDirectoryHandle(){
  try{return settings.folderHandle||null}catch(e){return null}
}
async function ensureFolderPermission(handle,write=false){
  if(!handle)return false;
  try{
    const mode=write?"readwrite":"read";
    if(handle.queryPermission){
      const q=await handle.queryPermission({mode});
      if(q==="granted")return true;
      if(handle.requestPermission){const r=await handle.requestPermission({mode});return r==="granted";}
      return false;
    }
    return true;
  }catch(e){return false}
}
async function loadFolderData(showMessage=false){
  const h=await getStoredDirectoryHandle();
  if(!h)return false;
  if(!(await ensureFolderPermission(h,false))){
    if(showMessage)setCloudStatus("⚠️ Offline • ไม่ได้รับสิทธิ์เข้าถึงโฟลเดอร์ข้อมูล");
    return false;
  }
  try{
    const f=await h.getFileHandle(DATA_FILE_NAME,{create:false});
    const file=await f.getFile();
    const text=await file.text();
    if(!text.trim())return false;
    const d=JSON.parse(text);
    if(!Array.isArray(d.people)||!Array.isArray(d.help)||!Array.isArray(d.statuses))throw new Error("ไฟล์ข้อมูลเดิมไม่ถูกต้อง");
    people=d.people; help=d.help; statuses=d.statuses;
    if(d.settings?.auth) settings.auth=d.settings.auth;
    if(d.settings?.communities) settings.communities=d.settings.communities;
    if(d.settings?.types) settings.types=d.settings.types;
    if(d.settings?.helps) settings.helps=d.settings.helps;
    communities=settings.communities?.length?settings.communities:DEFAULT_COMMUNITIES.slice();
    types=settings.types?.length?settings.types:DEFAULT_TYPES.slice();
    helps=settings.helps?.length?settings.helps:DEFAULT_HELPS.slice();
    // เก็บสำเนาใน IndexedDB เป็น cache เท่านั้น ไม่ใช่แหล่งข้อมูลหลักเมื่อเลือกโฟลเดอร์
    await cacheLocalData();
    setCloudStatus("📱 Offline • โหลดข้อมูลเดิมจากไฟล์สำเร็จ ("+people.length+" รายการ)");
    return true;
  }catch(e){
    if(e.name==="NotFoundError")return false;
    console.error("loadFolderData",e);
    if(showMessage)alert("ไม่สามารถอ่านไฟล์ข้อมูลเดิมในโฟลเดอร์ได้\n\n"+e.message);
    return false;
  }
}
async function cacheLocalData(){for(const [n,a] of [["people",people],["help",help],["statuses",statuses]]){await idbClear(n);for(const x of a)await idbPut(n,x)}}
async function writeFolderData(){
  const h=await getStoredDirectoryHandle();
  if(!h)return false;
  if(!(await ensureFolderPermission(h,true)))throw new Error("ไม่ได้รับสิทธิ์เขียนไฟล์ในโฟลเดอร์");
  const f=await h.getFileHandle(DATA_FILE_NAME,{create:true});
  const w=await f.createWritable();
  const payload={version:1,updatedAt:new Date().toISOString(),settings:{brandName:settings.brandName,brandSub:settings.brandSub,communities:settings.communities,types:settings.types,helps:settings.helps,auth:settings.auth},people,help,statuses};
  await w.write(JSON.stringify(payload,null,2));
  await w.close();
  return true;
}
async function save(){
  // IndexedDB เป็น cache เสมอ; แหล่งข้อมูลหลักถูกเลือกตอนตั้งค่าครั้งแรก
  await cacheLocalData();

  // เมื่อเลือก Cloud เป็นฐานข้อมูลหลัก ทุกการบันทึกข้อมูลต้องส่งขึ้น Cloud อัตโนมัติ
  // ไม่จำเป็นต้องกดปุ่ม "เชื่อมเครือข่ายออนไลน์" ซ้ำทุกครั้ง
  if(settings.cloudEnabled && String(settings.apiUrl||"").trim()){
    try{
      setCloudStatus("☁️ Online • กำลังบันทึกข้อมูลขึ้น Cloud…");
      await postCloud({action:"saveAll",people,help,statuses});
      API_URL=settings.apiUrl;
      setCloudStatus("☁️ Online • บันทึกข้อมูลขึ้น Cloud สำเร็จ");
      return;
    }catch(e){
      setCloudStatus("⚠️ Online • ส่งข้อมูลขึ้น Cloud ไม่สำเร็จ");
      throw new Error("ไม่สามารถส่งข้อมูลขึ้น Cloud ได้: "+e.message);
    }
  }

  // Offline: เขียนลงไฟล์หลักในโฟลเดอร์
  if(settings.folderHandle){
    try{
      await writeFolderData();
      setCloudStatus("📱 Offline • บันทึกลงไฟล์ข้อมูลแล้ว");
      return;
    }catch(e){
      setCloudStatus("⚠️ Offline • บันทึกไฟล์ไม่สำเร็จ");
      throw e;
    }
  }

  setCloudStatus("📱 Offline • บันทึกใน IndexedDB แล้ว");
}
async function cloudSync(){
  if(!isConfigured){alert("กรุณาตั้งค่าฐานข้อมูลก่อนใช้งาน Cloud");return}
  if(!settings.cloudEnabled||!settings.apiUrl){alert("ยังไม่ได้เปิดใช้งาน Cloud ในตั้งค่าระบบ");return}
  try{
    setCloudStatus("☁️ กำลังส่งข้อมูลขึ้น Cloud…");
    await cloudRequest("saveAll",{people,help,statuses});
    await loadCloud(false);
    setCloudStatus("☁️ Online • ซิงค์ Cloud สำเร็จ");
    render();
  }catch(e){
    setCloudStatus("⚠️ Online • ซิงค์ไม่สำเร็จ");
    alert("ซิงค์ Cloud ไม่สำเร็จ: "+e.message+"\n\nข้อมูลในเครื่องยังคงอยู่");
  }
}
async function postCloud(payload){
  const action=String(payload?.action||"");
  const body=Object.assign({},payload||{});
  delete body.action;
  return cloudRequest(action,body);
}
function parseCloudResponse(text){
  let d;
  try{d=typeof text==="string"?JSON.parse(text):text}catch(e){throw new Error("Google Apps Script ส่งข้อมูลกลับมาไม่ใช่ JSON")}
  if(d?.data && typeof d.data==="object") d=d.data;
  if(d?.result && typeof d.result==="object") d=d.result;
  if(!Array.isArray(d?.people)||!Array.isArray(d?.help)||!Array.isArray(d?.statuses)){
    throw new Error("ไม่พบข้อมูล people/help/statuses จาก Google Apps Script");
  }
  return d;
}

async function cloudRequest(action, payload=null){
  const target=String(settings.apiUrl||"").trim();
  if(!target) throw new Error("ยังไม่ได้ระบุ Google Apps Script Web App URL");

  // If this HTML is hosted on Cloudflare Pages and a same-origin proxy exists,
  // use it to avoid browser CORS/redirect problems with Google Apps Script.
  const proxyPath="/api/cloud";

  // เมื่อหน้าเว็บถูกเปิดจาก Cloudflare/HTTPS ให้ใช้ /api/cloud เสมอ
  // ห้ามตรวจเฉพาะ *.pages.dev เพราะผู้ใช้อาจใช้ Custom Domain ของ Cloudflare
  // หากเรียก Google Apps Script ตรงจาก Browser จะเกิด CORS/redirect และขึ้น "Failed to fetch"
  const useProxy=location.protocol==="https:" ||
                 location.hostname.endsWith(".pages.dev") ||
                 location.hostname==="localhost" ||
                 location.hostname==="127.0.0.1";

  if(useProxy){
    const r=await fetch(proxyPath,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({target,action,payload})
    });
    const t=await r.text();
    if(!r.ok){
      if(r.status===404){
        throw new Error("ไม่พบ Cloudflare Function /api/cloud — ต้องนำไฟล์ functions/api/cloud.js ไป Deploy พร้อมเว็บไซต์ก่อน");
      }
      throw new Error("Cloudflare Proxy HTTP "+r.status+(t?": "+t:""));
    }
    try{return JSON.parse(t)}catch(e){throw new Error("Cloudflare Proxy ส่งข้อมูลกลับมาไม่ใช่ JSON")}
  }

  // Direct fallback for environments where the page is not using the proxy.
  if(action==="getAll"){
    const r=await fetch(target+(target.includes("?")?"&":"?")+"action=getAll&t="+Date.now(),{method:"GET",cache:"no-store"});
    const t=await r.text();
    if(!r.ok) throw new Error("Google Apps Script HTTP "+r.status);
    try{return JSON.parse(t)}catch(e){throw new Error("Google Apps Script ส่งข้อมูลกลับมาไม่ใช่ JSON")}
  }

  const r=await fetch(target,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(Object.assign({action},payload||{}))
  });
  const t=await r.text();
  if(!r.ok) throw new Error("Google Apps Script HTTP "+r.status);
  try{return JSON.parse(t)}catch(e){throw new Error("Google Apps Script ส่งข้อมูลกลับมาไม่ใช่ JSON")}
}

function cloudGetUrl(){
  const base=String(settings.apiUrl||"").trim();
  if(!base)return "";
  return base+(base.includes("?")?"&":"?")+"action=getAll&t="+Date.now();
}
async function loadCloud(showMessage=true){
  if(!settings.cloudEnabled||!settings.apiUrl)return false;
  try{
    if(showMessage)setCloudStatus("☁️ Online • กำลังโหลดข้อมูลเดิมจาก Cloud…");
    const response=await cloudRequest("getAll");
    const d=parseCloudResponse(response);
    people=d.people; help=d.help; statuses=d.statuses;
    if(d.auth) settings.auth=d.auth;
    if(Array.isArray(d.settings?.communities)) settings.communities=d.settings.communities;
    if(Array.isArray(d.settings?.types)) settings.types=d.settings.types;
    if(Array.isArray(d.settings?.helps)) settings.helps=d.settings.helps;

    // ฐานข้อมูลรุ่นเก่าอาจไม่มี settings.* ให้สร้างรายการจากข้อมูลจริง
    if(!settings.communities?.length && Array.isArray(d.people)){
      settings.communities=[...new Set(
        d.people.map(p=>String(p?.community||"").trim()).filter(Boolean)
      )];
    }
    if(!settings.types?.length && Array.isArray(d.people)){
      settings.types=[...new Set(
        d.people.flatMap(p=>Array.isArray(p?.types)?p.types:[p?.types])
          .map(x=>String(x||"").trim()).filter(Boolean)
      )];
    }
    if(!settings.helps?.length && Array.isArray(d.help)){
      settings.helps=[...new Set(
        d.help.flatMap(h=>Array.isArray(h?.types)?h.types:[h?.types])
          .map(x=>String(x||"").trim()).filter(Boolean)
      )];
    }

    communities=settings.communities?.length?settings.communities:communities;
    types=settings.types?.length?settings.types:types;
    helps=settings.helps?.length?settings.helps:helps;

    if(communities.length){
      existingCloudCommunitiesLocked=true;
      existingCloudCommunities=communities.slice();
      const ce=document.getElementById("setCommunities");
      if(ce){ ce.value=communities.join(", "); ce.readOnly=true; }
    }
    // โหลดจาก Cloud แล้วเก็บไว้เป็น cache เท่านั้น ห้ามเรียก save()
    // เพราะ save() จะส่งข้อมูลกลับขึ้น Cloud อีกครั้งโดยไม่จำเป็น
    await cacheLocalData();
    setCloudStatus("☁️ Online • โหลดข้อมูลเดิมจาก Cloud สำเร็จ ("+people.length+" รายการ)");
    return true;
  }catch(e){
    console.error("loadCloud",e);
    setCloudStatus("⚠️ Online • โหลด Cloud ไม่สำเร็จ");
    if(showMessage)alert("ไม่สามารถดึงข้อมูลเดิมจาก Google Apps Script ได้\n\n"+e.message+"\n\nข้อมูล Offline ในเครื่องจะไม่ถูกลบ");
    return false;
  }
}
function updateModeUI(){
  const b=document.getElementById("themeToggle");
  if(b)b.textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀️ โหมดสว่าง":"🌙 โหมดมืด";
  // แสดง Online/Offline ตามวิธีฐานข้อมูลที่เลือกไว้ในการตั้งค่าครั้งแรก
  if(!isConfigured){
    setCloudStatus("⚙️ ยังไม่ได้ตั้งค่าฐานข้อมูล");
    return;
  }
  if(settings.cloudEnabled && settings.apiUrl){
    setCloudStatus("☁️ Online");
  }else{
    setCloudStatus("📱 Offline");
  }
}
function id(prefix){return prefix+"-"+Date.now().toString().slice(-8)}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function parseBirthDate(d){
  if(!d)return null;
  let parts=String(d).split("-");
  if(parts.length!==3)return null;
  let y=Number(parts[0]),m=Number(parts[1]),day=Number(parts[2]);
  if(!y||!m||!day)return null;
  let dt=new Date(y,m-1,day);
  if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==day)return null;
  return dt;
}
function age(d){
  let b=parseBirthDate(d);
  if(!b)return"";
  let n=new Date();
  let a=n.getFullYear()-b.getFullYear();
  if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;
  return a>=0?a:"";
}

function updateBirth(){
  const day=document.getElementById("birthDay")?.value||"";
  const month=document.getElementById("birthMonth")?.value||"";
  const yearBE=(document.getElementById("birthYearBE")?.value||"").replace(/\D/g,"");
  const ageBox=document.getElementById("age");
  const birthBox=document.getElementById("birth");

  if(day && month && yearBE.length===4){
    const gy=Number(yearBE)-543;
    const iso=`${gy}-${month}-${day}`;
    const b=parseBirthDate(iso);

    if(b && gy>=1900 && gy<=new Date().getFullYear()){
      birthBox.value=iso;
      ageBox.value=age(iso);
      return;
    }
  }
  birthBox.value="";
  ageBox.value="";
}
function setBirthFields(iso){
  if(!iso)return;
  let [y,m,d]=iso.split("-");
  const day=document.getElementById("birthDay"), month=document.getElementById("birthMonth"), year=document.getElementById("birthYearBE");
  if(day&&month&&year){
    day.value=d; month.value=m; year.value=Number(y)+543;
    document.getElementById("birth").value=iso;
    document.getElementById("age").value=age(iso);
  }
}

      let c=document.createElement("canvas"),max=1200,s=Math.min(1,max/img.width);
      c.width=img.width*s;c.height=img.height*s;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      let data=c.toDataURL("image/jpeg",.75);
      let box=document.getElementById("helpPhotoPreview"+n);

    img.src=r.result;
  };
  r.readAsDataURL(f);
}

if(!window.Tesseract){let s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";document.head.appendChild(s);await new Promise((res,rej)=>{s.onload=res;s.onerror=rej})}

try{let {data}=await Tesseract.recognize(img.src,"tha+eng");document.getElementById("note").value=(document.getElementById("note").value?document.getElementById("note").value+"\n":"")+"[OCR ข้อความดิบ] "+data.text; m.textContent="อ่านภาพเสร็จแล้ว ระบบใส่ข้อความ OCR ไว้ในหมายเหตุเพื่อให้ตรวจสอบก่อนนำไปใช้";}catch(e){m.textContent="OCR ไม่สำเร็จ กรุณากรอกข้อมูลด้วยตนเอง"}}

async function chooseDatabaseFolder(){
  if(!window.showDirectoryPicker){alert("กรุณาใช้ Chrome หรือ Edge รุ่นปัจจุบัน");return}
  try{
    const h=await showDirectoryPicker({mode:"readwrite"});
    if(!(await ensureFolderPermission(h,true))) throw new Error("ไม่ได้รับสิทธิ์อ่าน/เขียนโฟลเดอร์");
    selectedFolderName=h.name||"CommunityCareDB";
    settings.folderName=selectedFolderName;
    settings.folderHandle=h;
    await persistSettings();
    sourcePreviewStatus="📁 เลือกโฟลเดอร์แล้ว • กด “🔄 เรียกข้อมูลจากฐานข้อมูล” เพื่ออ่านข้อมูลเดิม";

  }catch(e){if(e.name!=="AbortError")alert("เลือกโฟลเดอร์ไม่สำเร็จ: "+e.message)}
}

function restoreDatabase(){if(!isConfigured){alert("กรุณาตั้งค่าระบบก่อน");return}const i=document.createElement("input");i.type="file";i.accept=".json,application/json";i.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.people)||!Array.isArray(d.help)||!Array.isArray(d.statuses))throw new Error("ไฟล์สำรองไม่ถูกต้อง");if(!confirm("กู้คืนข้อมูลหรือไม่? ข้อมูล Offline ปัจจุบันจะถูกแทนที่"))return;people=d.people;help=d.help;statuses=d.statuses;await save();alert("✅ กู้คืนข้อมูลสำเร็จ");render()}catch(x){alert("กู้คืนไม่สำเร็จ: "+x.message)}};i.click()}
async function bytesToHex(buf){return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("")}
function randomHex(bytes=16){const a=new Uint8Array(bytes);crypto.getRandomValues(a);return Array.from(a).map(b=>b.toString(16).padStart(2,"0")).join("")}
async function hashPassword(password,saltHex){const enc=new TextEncoder();const salt=Uint8Array.from((saltHex.match(/.{2}/g)||[]).map(x=>parseInt(x,16)));const key=await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveBits"]);const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:120000,hash:"SHA-256"},key,256);return bytesToHex(bits)}
async function createAuth(email,password){const salt=randomHex(16);return {email:email.toLowerCase(),salt,hash:await hashPassword(password,salt)}}
async function verifyLocalAuth(email,password){const a=settings.auth;if(!a?.email||!a?.hash||!a?.salt)return false;return a.email===email.toLowerCase() && (await hashPassword(password,a.salt))===a.hash}

async function doLogin(){
  const email=document.getElementById("loginEmail").value.trim().toLowerCase();
  const password=document.getElementById("loginPassword").value;
  const msg=document.getElementById("authMsg");
  if(!email || !password){
    msg.innerHTML='<div class="authError">กรุณากรอก Email และ Password</div>';
    return;
  }
  try{
    let valid=false;
    if(settings.cloudEnabled&&settings.apiUrl){
      const salt=String(settings.auth?.salt||"");
      if(!salt) throw new Error("ไม่พบข้อมูลความปลอดภัยของบัญชีในฐานข้อมูล");
      const passwordHash=await hashPassword(password,salt);
      const d=await cloudRequest("verifyAuth",{email,passwordHash});
      valid=!!(d && d.ok===true && d.valid===true);
      if(!valid) throw new Error(d?.error||"Email หรือ Password ไม่ถูกต้อง");
    }else{
      valid=await verifyLocalAuth(email,password);
      if(!valid) throw new Error("Email หรือ Password ไม่ถูกต้อง");
    }
    if(valid!==true) throw new Error("Email หรือ Password ไม่ถูกต้อง");
    authenticated=true;
    page="home";
    document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page==="home"));
    document.getElementById("authGate")?.remove();
    render();
  }catch(e){
    authenticated=false;
    msg.innerHTML='<div class="authError">❌ '+esc(e.message||"Email หรือ Password ไม่ถูกต้อง")+'</div>';
  }
}

const OFFLINE_CREATOR_RESET_CODE = "AnusornBoonman1985";

async function resetOfflinePassword(){
  const creatorCode=String(document.getElementById("creatorResetCode")?.value||"");

  const p1=String(document.getElementById("offlineResetPassword")?.value||"");

  if(creatorCode !== OFFLINE_CREATOR_RESET_CODE){
    msg.innerHTML='<div class="authError">❌ รหัสผู้สร้างระบบไม่ถูกต้อง</div>';

  }
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){

  try{

// เมื่อพบฐานข้อมูลเดิม: ใช้รายชื่อชุมชนเดิมเป็นข้อมูลหลัก
// แต่ไม่บังคับให้ผู้ใช้ดึง/กรอก/แก้ไขรายชื่อในหน้าตั้งค่า
let existingCloudCommunitiesLocked = false;
let existingCloudCommunities = [];
let sourcePreviewStatus = "";
let sourcePreviewFound = false;

function applyExistingCommunityLock(){
  const el = document.getElementById("setCommunities");
  if(!el) return;
  el.value = (existingCloudCommunities.length ? existingCloudCommunities : communities).join(", ");
  el.readOnly = true;
  el.setAttribute("aria-readonly","true");
  el.title = "รายการที่บันทึกแล้วห้ามลบหรือแก้ไข สามารถเพิ่มรายการใหม่ผ่านปุ่ม “➕ เพิ่มข้อมูล” ได้";
}


function mergeCommunityNames(base, additions){
  const out=[];
  const seen=new Set();
  [...(Array.isArray(base)?base:[]), ...(Array.isArray(additions)?additions:[])].forEach(v=>{
    const name=String(v||"").trim();
    if(!name) return;
    const key=name.toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    out.push(name);
  });
  return out;
}

function updateSourcePreviewStatus(message){
  sourcePreviewStatus=String(message||"");
  const el=document.getElementById("sourcePreviewStatus");
  if(el) el.textContent=sourcePreviewStatus;
}

function isMeaningfulRetrievedDatabase(d){
  if(!d || typeof d!=="object") return false;
  const peopleArr=Array.isArray(d.people)?d.people:[];
  const helpArr=Array.isArray(d.help)?d.help:[];
  const statusArr=Array.isArray(d.statuses)?d.statuses:[];
  const s=(d.settings && typeof d.settings==="object")?d.settings:{};
  const communities=Array.isArray(s.communities)?s.communities:((Array.isArray(d.communities)?d.communities:[]));
  const types=Array.isArray(s.types)?s.types:((Array.isArray(d.types)?d.types:[]));
  const helps=Array.isArray(s.helps)?s.helps:((Array.isArray(d.helps)?d.helps:[]));
  const auth=d.auth || s.auth;
  const hasAuth=!!(auth && auth.email && auth.salt && auth.hash);
  const customTypes=types.some(v=>!DEFAULT_TYPES.includes(String(v)) ) || types.length!==DEFAULT_TYPES.length;
  const customHelps=helps.some(v=>!DEFAULT_HELPS.includes(String(v)) ) || helps.length!==DEFAULT_HELPS.length;
  const hasBrand=!!(s.brandName || (s.brandSub && s.brandSub!==DEFAULT_HEADER));
  return peopleArr.length>0 || helpArr.length>0 || statusArr.length>0 || communities.length>0 || hasAuth || customTypes || customHelps || hasBrand;
}

function normalizeRetrievedSettings(d){
  const out={
    people:Array.isArray(d?.people)?d.people:[],
    help:Array.isArray(d?.help)?d.help:[],
    statuses:Array.isArray(d?.statuses)?d.statuses:[],
    settings:(d?.settings && typeof d.settings==="object")?d.settings:{},
    auth:(d?.auth && typeof d.auth==="object")?d.auth:null
  };
  if(!out.auth && out.settings.auth) out.auth=out.settings.auth;
  if(!Array.isArray(out.settings.communities) && Array.isArray(d?.communities)) out.settings.communities=d.communities;
  if(!Array.isArray(out.settings.types) && Array.isArray(d?.types)) out.settings.types=d.types;
  if(!Array.isArray(out.settings.helps) && Array.isArray(d?.helps)) out.settings.helps=d.helps;
  if(!out.settings.communities?.length && out.people.length){
    out.settings.communities=[...new Set(out.people.map(p=>String(p?.community||"").trim()).filter(Boolean))];
  }
  if(!out.settings.types?.length && out.people.length){
    out.settings.types=[...new Set(out.people.flatMap(p=>Array.isArray(p?.types)?p.types:[p?.types]).map(x=>String(x||"").trim()).filter(Boolean))];
  }
  if(!out.settings.helps?.length && out.help.length){
    out.settings.helps=[...new Set(out.help.flatMap(h=>Array.isArray(h?.types)?h.types:[h?.types]).map(x=>String(x||"").trim()).filter(Boolean))];
  }
  return out;
}

async function previewDatabaseSource(){
  const cloud=document.getElementById("setCloudEnabled")?.checked===true;
  const api=(document.getElementById("setApiUrl")?.value||"").trim();
  try{
    updateSourcePreviewStatus("⏳ กำลังเรียกข้อมูลจากฐานข้อมูล…");

    let raw=null;
    if(cloud){
      if(!api){
        updateSourcePreviewStatus("❌ กรุณากรอก Google Apps Script Web App URL ก่อน");
        alert("กรุณากรอก Google Apps Script Web App URL ก่อนเรียกข้อมูล");
        return;
      }
      const oldUrl=settings.apiUrl;
      const oldCloud=settings.cloudEnabled;
      settings.apiUrl=api;
      settings.cloudEnabled=true;
      try{
        raw=await cloudRequest("getAll");
      }finally{
        settings.apiUrl=oldUrl;
        settings.cloudEnabled=oldCloud;
      }
    }else{
      const h=await getStoredDirectoryHandle();
      if(!h){
        updateSourcePreviewStatus("❌ กรุณาเลือกโฟลเดอร์ Offline ก่อน");
        alert("กรุณาเลือกโฟลเดอร์ฐานข้อมูล Offline ก่อนเรียกข้อมูล");
        return;
      }
      if(!(await ensureFolderPermission(h,false))){
        updateSourcePreviewStatus("❌ ไม่ได้รับสิทธิ์อ่านโฟลเดอร์");
        alert("ไม่ได้รับสิทธิ์อ่านโฟลเดอร์ฐานข้อมูล Offline");
        return;
      }
      try{
        const fh=await h.getFileHandle(DATA_FILE_NAME,{create:false});
        const file=await fh.getFile();
        const text=await file.text();
        if(!text.trim()) raw={people:[],help:[],statuses:[],settings:{}};
        else raw=JSON.parse(text);
      }catch(e){
        if(e.name==="NotFoundError") raw=null; else throw e;
      }
    }

    if(!raw){
      sourcePreviewFound=false;
      sourcePreviewStatus="🟡 ไม่พบไฟล์/ฐานข้อมูลเดิม • กรุณากรอกข้อมูลตั้งค่าใหม่";
      alert("ไม่พบข้อมูลเก่าในแหล่งฐานข้อมูลที่เลือก\n\nกรุณากรอกข้อมูลใหม่ในช่องตั้งค่า แล้วกด “บันทึกและเปิดใช้งาน”");
      render();
      return;
    }

    const d=normalizeRetrievedSettings(raw);
    const found=isMeaningfulRetrievedDatabase(d);
    sourcePreviewFound=found;

    if(!found){
      // คงช่องให้กรอกข้อมูลใหม่ แต่ไม่ทำข้อมูลที่ผู้ใช้กรอกอยู่หาย
      sourcePreviewStatus="🟡 ไม่พบข้อมูลเก่าที่ใช้งานได้ • กรุณากรอกข้อมูลตั้งค่าใหม่";
      alert("ไม่พบข้อมูลเก่าในฐานข้อมูล\n\nกรุณากรอกข้อมูลใหม่ในช่องตั้งค่า แล้วกด “บันทึกและเปิดใช้งาน”");
      render();
      return;
    }

    // โหลดข้อมูลตั้งค่ากลับมาแสดงในช่องต่าง ๆ โดยยังไม่เปิดใช้งานระบบ
    people=d.people; help=d.help; statuses=d.statuses;
    if(d.auth) settings.auth=d.auth;
    if(Array.isArray(d.settings.communities)) settings.communities=mergeCommunityNames([],d.settings.communities);
    if(Array.isArray(d.settings.types) && d.settings.types.length) settings.types=d.settings.types.slice();
    if(Array.isArray(d.settings.helps) && d.settings.helps.length) settings.helps=d.settings.helps.slice();
    if(d.settings.brandSub) settings.brandSub=d.settings.brandSub;

    communities=mergeCommunityNames([],settings.communities||[]);
    types=settings.types?.length?settings.types.slice():types;
    helps=settings.helps?.length?settings.helps.slice():helps;
    settings.communities=communities.slice();
    existingCloudCommunities=communities.slice();
    existingCloudCommunitiesLocked=communities.length>0;

    if(d.auth){
      existingAuthLoaded=!!(d.auth.email&&d.auth.salt&&d.auth.hash);
      existingAuthEmail=d.auth.email||"";
    }

    sourcePreviewStatus=(cloud?"☁️":"📱")+" พบข้อมูลเก่าแล้ว • โหลดการตั้งค่าเดิมมาแสดงเรียบร้อย กด “บันทึกและเปิดใช้งาน” ได้เลย";
    render();
    updateSourcePreviewStatus(sourcePreviewStatus);
    alert("✅ พบข้อมูลเก่าแล้ว\n\nระบบนำการตั้งค่าเดิมมาแสดงในช่องต่าง ๆ แล้ว\nสามารถกด “บันทึกและเปิดใช้งาน” ได้เลย");
  }catch(e){
    console.error("previewDatabaseSource",e);
    sourcePreviewFound=false;
    updateSourcePreviewStatus("❌ เรียกข้อมูลไม่สำเร็จ: "+e.message);
    alert("ไม่สามารถเรียกข้อมูลจากฐานข้อมูลได้\n\n"+e.message);
  }
}

async function addCommunitiesNow(){
  const input=document.getElementById("setNewCommunities");
  const raw=(input?.value||"").trim();
  if(!raw){alert("กรุณากรอกชื่อชุมชน / โซนย่อยที่ต้องการเพิ่ม");return}
  const additions=raw.split(",").map(x=>x.trim()).filter(Boolean);
  const before=Array.isArray(communities)?communities.slice():[];
  const merged=mergeCommunityNames(before,additions);
  const added=merged.filter(x=>!before.some(y=>String(y).trim().toLowerCase()===x.toLowerCase()));
  if(!added.length){alert("ไม่มีชื่อใหม่ที่จะเพิ่ม\n\nชื่อที่กรอกมีอยู่ในฐานข้อมูลแล้ว");return}

  const cloud=document.getElementById("setCloudEnabled")?.checked===true || (settings.cloudEnabled && settings.apiUrl);
  const api=(document.getElementById("setApiUrl")?.value||settings.apiUrl||"").trim();
  try{
    if(cloud){
      if(!api) throw new Error("กรุณากรอก Google Apps Script Web App URL ก่อนเพิ่มข้อมูล");
      const oldUrl=settings.apiUrl, oldCloud=settings.cloudEnabled;
      settings.apiUrl=api; settings.cloudEnabled=true;
      try{
        const r=await cloudRequest("saveCommunities",{communities:merged});
        if(!r?.ok) throw new Error(r?.error||"บันทึกรายชื่อชุมชนไม่สำเร็จ");
        communities=mergeCommunityNames(before,Array.isArray(r.communities)?r.communities:added);
      }finally{
        settings.apiUrl=oldUrl; settings.cloudEnabled=oldCloud;
      }
    }else{
      const h=await getStoredDirectoryHandle();
      if(!h) throw new Error("กรุณาเลือกโฟลเดอร์ฐานข้อมูล Offline ก่อนเพิ่มข้อมูล");
      if(!(await ensureFolderPermission(h,true))) throw new Error("ไม่ได้รับสิทธิ์เขียนฐานข้อมูล Offline");
      settings.communities=merged.slice();
      communities=merged.slice();
      await writeFolderData();
    }

    settings.communities=communities.slice();
    existingCloudCommunities=communities.slice();
    existingCloudCommunitiesLocked=communities.length>0;
    await persistSettings();
    if(input) input.value="";
    sourcePreviewStatus=(cloud?"☁️":"📱")+" เพิ่มชุมชนสำเร็จ • "+added.join(", ");
    render();
    updateSourcePreviewStatus(sourcePreviewStatus);
    alert("✅ เพิ่มชุมชน / โซนย่อยสำเร็จ\n\n"+added.join("\n")+"\n\nชื่อใหม่ถูกบันทึกลงฐานข้อมูลแล้ว และจะปรากฏในตัวเลือก “ชุมชน/โซน *” ของหน้าเพิ่มข้อมูล");
  }catch(e){
    console.error("addCommunitiesNow",e);
    alert("❌ เพิ่มชุมชน / โซนย่อยไม่สำเร็จ\n\n"+e.message);
  }
}

async function saveSettings(){
  const bSub=document.getElementById("setBrandSub").value.trim();
  const api=document.getElementById("setApiUrl").value.trim();
  const cloud=document.getElementById("setCloudEnabled").checked;

  let authEmail=document.getElementById("setAuthEmail").value.trim().toLowerCase();
  let authPassword=document.getElementById("setAuthPassword").value;

  // อ่านค่าที่ผู้ใช้กรอกไว้ก่อน แต่ถ้าเป็น Cloud ให้ตรวจฐานข้อมูลเดิมก่อน
  const existingCs=(Array.isArray(communities)?communities:[]).map(x=>String(x||"").trim()).filter(Boolean);
  const newCsRaw=document.getElementById("setNewCommunities")?.value||"";
  let newCs=newCsRaw.split(",").map(x=>x.trim()).filter(Boolean);
  let cs=mergeCommunityNames(existingCs,newCs);
  if(existingCloudCommunities.length){
    cs=mergeCommunityNames(existingCloudCommunities,cs);
  }
  let ts=document.getElementById("setTypes").value.split(",").map(x=>x.trim()).filter(Boolean);
  let hs=document.getElementById("setHelps").value.split(",").map(x=>x.trim()).filter(Boolean);

  let cloudOld=null;

  if(cloud && !api){
    alert("หากเปิด Cloud กรุณาระบุ URL");
    return;
  }

  // สำคัญ: เมื่อใส่ Web App URL แล้วกดบันทึก ให้ตรวจฐานข้อมูลเดิมก่อน
  // และนำการตั้งค่าเดิมกลับมาใช้ โดยเฉพาะ "รายชื่อชุมชน / โซนย่อย"
  if(cloud && api){
    try{
      setCloudStatus("☁️ กำลังตรวจสอบฐานข้อมูลเดิมจาก Cloud…");
      const dd=await cloudRequest("getAll");
      if(dd?.data && typeof dd.data==="object") cloudOld=dd.data;
      else if(dd?.result && typeof dd.result==="object") cloudOld=dd.result;
      else cloudOld=dd;

      // ดึง Login เดิม
      if(cloudOld?.auth?.email && cloudOld?.auth?.salt && cloudOld?.auth?.hash){
        settings.auth=cloudOld.auth;
        authEmail=cloudOld.auth.email;
        authPassword="";
        existingAuthLoaded=true;
        existingAuthEmail=cloudOld.auth.email;
      }

      // ดึงการตั้งค่าเดิมจากฐานข้อมูล
      const oldSettings=cloudOld?.settings || {};

      // รองรับทั้งฐานข้อมูลใหม่ที่เก็บ settings และฐานข้อมูลเดิมที่อาจส่ง
      // communities/types/helps ไว้ระดับบนสุด
      if(Array.isArray(cloudOld?.communities) && cloudOld.communities.length && !oldSettings.communities){
        oldSettings.communities=cloudOld.communities;
      }

      // ฐานข้อมูลเดิม: ล็อกรายชื่อชุมชนเดิมไว้ใช้ภายในระบบ
      // ไม่ต้องให้ผู้ใช้กรอกหรือแก้ไขใหม่ในหน้าตั้งค่า
      if(Array.isArray(oldSettings.communities) && oldSettings.communities.length){
        existingCloudCommunitiesLocked=true;
        existingCloudCommunities=oldSettings.communities.map(x=>String(x).trim()).filter(Boolean);
        communities=existingCloudCommunities.slice();
        applyExistingCommunityLock();
      }
      if(Array.isArray(cloudOld?.types) && cloudOld.types.length && !oldSettings.types){
        oldSettings.types=cloudOld.types;
      }
      if(Array.isArray(cloudOld?.helps) && cloudOld.helps.length && !oldSettings.helps){
        oldSettings.helps=cloudOld.helps;
      }

      // รวมรายชื่อเดิม + รายชื่อใหม่ทุกครั้ง ห้ามทำให้รายการใหม่หาย
      if(Array.isArray(oldSettings.communities) && oldSettings.communities.length){
        cs=mergeCommunityNames(oldSettings.communities,cs);
      }
      communities=cs.slice();
      existingCloudCommunities=cs.slice();
      existingCloudCommunitiesLocked=cs.length>0;
      const el=document.getElementById("setCommunities");
      if(el) el.value=cs.join(", ");

      // ดึงประเภทผู้ขอรับความช่วยเหลือเดิมด้วย หากมี
      if(Array.isArray(oldSettings.types) && oldSettings.types.length){
        ts=oldSettings.types.map(x=>String(x).trim()).filter(Boolean);
        types=ts;
        const el=document.getElementById("setTypes");
        if(el) el.value=ts.join(", ");
      }

      // ดึงประเภทการช่วยเหลือเดิมด้วย หากมี
      if(Array.isArray(oldSettings.helps) && oldSettings.helps.length){
        hs=oldSettings.helps.map(x=>String(x).trim()).filter(Boolean);
        helps=hs;
        const el=document.getElementById("setHelps");
        if(el) el.value=hs.join(", ");
      }

      // นำรายละเอียดเดิมกลับมา หากมี และผู้ใช้ยังไม่ได้เปลี่ยน
      if(oldSettings.brandSub && !bSub){
        const el=document.getElementById("setBrandSub");
        if(el) el.value=oldSettings.brandSub;
      }

      // ถ้ามีฐานข้อมูลเดิม ไม่บังคับให้ผู้ใช้กรอกข้อมูลชุมชนใหม่
      // หากไม่มีข้อมูลเดิมจึงค่อยใช้ค่าที่ผู้ใช้กรอก
    }catch(e){
      console.warn("ตรวจฐานข้อมูลเดิมจาก Cloud",e);
      // ให้ loadCloud ด้านล่างตรวจซ้ำและแจ้งข้อผิดพลาดอย่างเป็นทางการ
    }
  }

  // ===== ฐานข้อมูลเดิม / Cloud: ไม่บังคับกรอกค่าตั้งค่าซ้ำ =====
  // หากมี URL Cloud ให้ถือว่าเป็นฐานข้อมูลที่อาจมีข้อมูลเดิมอยู่แล้ว
  // รายชื่อชุมชน/โซนและรายการอื่น ๆ จะใช้ค่าจาก Cloud ถ้ามี
  // หาก Cloud รุ่นเก่าไม่มี settings ระบบจะใช้ค่าที่อ่านจาก people/help
  // และจะไม่หยุดด้วยข้อความ "กรุณากรอกข้อมูลตั้งค่าให้ครบ"

  const hasCloudTarget = !!(cloud && api);

  if(cloudOld){
    const oldSettings=cloudOld.settings || {};

    // รองรับทั้งรูปแบบ settings.* และค่าระดับบนสุด
    if(Array.isArray(cloudOld.communities) && cloudOld.communities.length && !oldSettings.communities)
      oldSettings.communities=cloudOld.communities;
    if(Array.isArray(cloudOld.types) && cloudOld.types.length && !oldSettings.types)
      oldSettings.types=cloudOld.types;
    if(Array.isArray(cloudOld.helps) && cloudOld.helps.length && !oldSettings.helps)
      oldSettings.helps=cloudOld.helps;

    // ชุมชนเดิม: รวมจาก settings.communities ก่อนเสมอ
    if(Array.isArray(oldSettings.communities) && oldSettings.communities.length){
      cs=mergeCommunityNames(oldSettings.communities,cs);
    }

    // ฐานข้อมูลเก่าที่ไม่มี settings.communities:
    // ค่อยสร้างจาก people.community เมื่อยังไม่มีรายการใด ๆ จริง ๆ
    if(!cs.length && Array.isArray(cloudOld.people)){
      cs=[...new Set(
        cloudOld.people
          .map(p=>String(p?.community||"").trim())
          .filter(Boolean)
      )];
    }

    // ประเภทเดิม
    if(Array.isArray(oldSettings.types) && oldSettings.types.length){
      ts=oldSettings.types.map(x=>String(x).trim()).filter(Boolean);
    }
    if(!ts.length && Array.isArray(cloudOld.people)){
      ts=[...new Set(
        cloudOld.people
          .flatMap(p=>Array.isArray(p?.types)?p.types:[p?.types])
          .map(x=>String(x||"").trim())
          .filter(Boolean)
      )];
    }

    // ประเภทการช่วยเหลือเดิม
    if(Array.isArray(oldSettings.helps) && oldSettings.helps.length){
      hs=oldSettings.helps.map(x=>String(x).trim()).filter(Boolean);
    }
    if(!hs.length && Array.isArray(cloudOld.help)){
      hs=[...new Set(
        cloudOld.help
          .flatMap(h=>Array.isArray(h?.types)?h.types:[h?.types])
          .map(x=>String(x||"").trim())
          .filter(Boolean)
      )];
    }

    // เก็บรายการชุมชนเดิมไว้ใช้ในหน้าเพิ่มข้อมูล
    if(cs.length){
      existingCloudCommunitiesLocked=true;
      existingCloudCommunities=cs.slice();
      communities=cs.slice();
    }
    if(ts.length) types=ts.slice();
    if(hs.length) helps=hs.slice();

    // แสดงค่าที่พบในช่องตั้งค่าเพื่อให้ผู้ใช้เห็น แต่ชุมชนเดิมถูกล็อก
    const ce=document.getElementById("setCommunities");
    if(ce && cs.length){
      ce.value=cs.join(", ");
      ce.readOnly=true;
      ce.title="ฐานข้อมูลเดิมมีรายการนี้อยู่แล้ว ระบบจะใช้รายการเดิม";
    }
    const te=document.getElementById("setTypes");
    if(te && ts.length) te.value=ts.join(", ");
    const he=document.getElementById("setHelps");
    if(he && hs.length) he.value=hs.join(", ");
  }

  // ถ้า Cloud มีข้อมูลเดิม แต่ยังไม่มี settings บางรายการ
  // ไม่ต้องบังคับผู้ใช้กรอกใหม่ ให้ใช้ค่าที่มีอยู่ในเครื่อง/ค่าเริ่มต้น
  if(!cs.length) cs=communities?.length?communities.slice():DEFAULT_COMMUNITIES.slice();
  if(!ts.length) ts=types?.length?types.slice():DEFAULT_TYPES.slice();
  if(!hs.length) hs=helps?.length?helps.slice():DEFAULT_HELPS.slice();

  // กรณี Online: มี URL แล้วให้ผ่านขั้นตอนตั้งค่าได้เลย
  // ไม่บังคับกรอก communities/types/helps ซ้ำ
  // กรณี Offline ฐานข้อมูลใหม่จึงค่อยบังคับกรอก
  if(!hasCloudTarget){
    if(!cs.length||!ts.length||!hs.length){
      alert("กรุณากรอกข้อมูลตั้งค่าให้ครบ");
      return;
    }
  }

  if(!authEmail) authEmail=settings.auth?.email||"";
  if(!authEmail||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(authEmail)){
    alert("กรุณากรอก Email สำหรับเข้าสู่ระบบให้ถูกต้อง");
    return;
  }

  // ถ้ามี Login เดิม ห้ามเปลี่ยน Password และกดบันทึกผ่านได้เลย
  if(existingAuthLoaded || settings.auth?.hash){
    authPassword="";
  }else{
    if(!authPassword){
      alert("กรุณาตั้ง Password อย่างน้อย 6 ตัวอักษร");
      return;
    }
    if(authPassword.length<6){
      alert("กรุณาตั้ง Password อย่างน้อย 6 ตัวอักษร");
      return;
    }
  }

  if(!authEmail) authEmail=settings.auth?.email||"";
  if(!authEmail||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(authEmail)){
    alert("กรุณากรอก Email สำหรับเข้าสู่ระบบให้ถูกต้อง");
    return;
  }

  // ถ้ามี Login เดิม ห้ามเปลี่ยน Password และกดบันทึกผ่านได้เลย
  if(existingAuthLoaded || settings.auth?.hash){
    authPassword="";
  }else{
    if(!authPassword){
      alert("กรุณาตั้ง Password อย่างน้อย 6 ตัวอักษร");
      return;
    }
    if(authPassword.length<6){
      alert("กรุณาตั้ง Password อย่างน้อย 6 ตัวอักษร");
      return;
    }
  }

  if(!cloud&&!settings.folderHandle){
    alert("กรุณาเลือกโฟลเดอร์สำหรับฐานข้อมูล Offline ก่อน");
    return;
  }

  const oldSettingsState=settings, oldConfigured=isConfigured, oldAPI=API_URL;
  let newAuth=settings.auth;

  // สร้าง Login ใหม่เฉพาะกรณีฐานข้อมูลยังไม่มี Login เดิม
  if(authPassword){
    newAuth=await createAuth(authEmail,authPassword);
  }else if(newAuth){
    // ห้ามแก้ Email/Password เดิม
    newAuth=Object.assign({},newAuth);
  }else if(cloudOld?.auth){
    newAuth=cloudOld.auth;
  }

  const candidate=Object.assign({},settings,{
    brandName:DEFAULT_NAME,
    brandSub:(document.getElementById("setBrandSub").value.trim()||DEFAULT_HEADER),
    apiUrl:cloud?api:"",
    communities:cs,
    types:ts,
    helps:hs,
    configured:false,
    cloudEnabled:cloud,
    folderName:selectedFolderName||settings.folderName||"",
    auth:newAuth
  });

  settings=candidate;
  API_URL=cloud?api:"";
  communities=cs;
  types=ts;
  helps=hs;

  isConfigured=true;
  people=[]; help=[]; statuses=[];

  try{
    if(cloud){
      setCloudStatus("☁️ กำลังตรวจสอบและดึงข้อมูลเดิมจาก Cloud ก่อนเปิดใช้งาน…");
      const ok=await loadCloud(true);
      if(!ok) throw new Error("เชื่อมต่อ Cloud หรือดึงข้อมูลเดิมไม่สำเร็จ กรุณาตรวจสอบ URL/การเผยแพร่ Web App และ Cloudflare Pages Function /api/cloud");

      // loadCloud อาจได้ settings เดิมมาแล้ว ให้ค่าจาก Cloud เป็นหลัก
      if(Array.isArray(settings.communities) && settings.communities.length){
        communities=settings.communities.slice();
        cs=communities.slice();
      }

      // 1) บันทึก communities แบบ append-only โดยตรง เพื่อไม่ให้รายการใหม่หาย
      const communityResult = await cloudRequest("saveCommunities", {
        communities: communities.slice()
      });
      if(!communityResult.ok){
        throw new Error(communityResult.error || "ไม่สามารถบันทึกรายชื่อชุมชนลง Cloud ได้");
      }

      if(Array.isArray(communityResult.communities)){
        communities = communityResult.communities.slice();
        cs = communities.slice();
        settings.communities = communities.slice();
        existingCloudCommunities = communities.slice();
        existingCloudCommunitiesLocked = communities.length > 0;
      }

      // 2) บันทึกเฉพาะ settings อื่นและ Auth โดยไม่แตะ communities
      const payload = {
        action: "saveAuth",
        settings: {
          types: types,
          helps: helps,
          brandSub: settings.brandSub
        }
      };
      if(newAuth) payload.auth = newAuth;

      const ad = await cloudRequest("saveAuth", payload);
      if(!ad.ok) throw new Error(ad.error || "ไม่สามารถบันทึกการตั้งค่าลง Cloud ได้");
    }else{
      if(!(await ensureFolderPermission(settings.folderHandle,true)))
        throw new Error("ไม่ได้รับสิทธิ์อ่าน/เขียนโฟลเดอร์");

      const loaded=await loadFolderData(false);
      if(!loaded){
        const f=await settings.folderHandle.getFileHandle(DATA_FILE_NAME,{create:false})
          .catch(e=>{if(e.name==="NotFoundError")return null;throw e});
        if(f) throw new Error("ไฟล์ข้อมูลเดิมไม่ถูกต้องหรืออ่านไม่ได้");
      }

      // Offline: บันทึก Login และการตั้งค่าลงฐานข้อมูลที่เลือก
      await writeFolderData();
    }

    settings.configured=true;
    isConfigured=true;
    authenticated=false;
    await persistSettings();

    updateHeaderUI();
    updateModeUI();
    render();

    alert(
      `✅ ตั้งค่าและตรวจสอบสำเร็จ\n\n`+
      `โหมดการทำงาน: ${cloud?"☁️ Online • Google Apps Script เป็นฐานข้อมูลหลัก":"📱 Offline • community-care-data.json เป็นฐานข้อมูลหลัก"}\n\n`+
      `รายชื่อชุมชน / โซนย่อย: ${communities.join(", ")}\n\n`+
      `กรุณา Login ก่อนเริ่มใช้งาน`
    );

    page="home";
    showLoginGate();
  }catch(e){
    console.error("saveSettings",e);
    settings=oldSettingsState;
    isConfigured=oldConfigured;
    API_URL=oldAPI;
    communities=settings.communities?.length?settings.communities:DEFAULT_COMMUNITIES.slice();
    types=settings.types?.length?settings.types:DEFAULT_TYPES.slice();
    helps=settings.helps?.length?settings.helps:DEFAULT_HELPS.slice();
    people=[];help=[];statuses=[];
    updateHeaderUI();
    updateModeUI();
    render();
    alert("❌ ยังไม่เปิดใช้งานระบบ\n\n"+e.message+"\n\nการตั้งค่าที่ยังไม่ผ่านการตรวจสอบจะไม่ถูกบันทึกเป็นสถานะพร้อมใช้งาน");
  }
}
async function resetSettings(){
  if(!confirm(
    "ต้องการล้างการตั้งค่าเครื่องนี้หรือไม่?\n\n"+
    "ระบบจะล้างเฉพาะการตั้งค่า Online/Offline, URL Cloud, โฟลเดอร์ที่เลือก และค่าการตั้งค่าของเครื่องนี้\n"+
    "ข้อมูลผู้ขอรับความช่วยเหลือและข้อมูลการช่วยเหลือจะไม่ถูกลบ\n"+
    "ไฟล์ community-care-data.json และข้อมูลบน Cloud จะไม่ถูกลบ"
  )) return;

  // ล้างเฉพาะสถานะการตั้งค่า ไม่แตะข้อมูล people/help/statuses
  try{
    if(dbReady) await idbClear("settings");
  }catch(e){
    console.warn("clear settings store", e);
  }

  // ล้างค่าการตั้งค่าที่เก็บไว้เฉพาะเครื่อง
  try{
    localStorage.removeItem(DEVICE_CONFIG_KEY);
  }catch(e){
    console.warn("clear device config", e);
  }

  settings={
    apiUrl:"",
    communities:[],
    types:DEFAULT_TYPES.slice(),
    helps:DEFAULT_HELPS.slice(),
    brandName:DEFAULT_NAME,
    brandSub:DEFAULT_HEADER,
    configured:false,
    cloudEnabled:false,
    theme:"light",
    folderName:"",
    folderHandle:null,
    auth:null
  };

  people=[];
  help=[];
  statuses=[];
  isConfigured=false;
  authenticated=false;
  API_URL="";
  communities=settings.communities;
  types=settings.types;
  helps=settings.helps;
  selectedFolderName="";

  document.documentElement.removeAttribute("data-theme");

  // บันทึกสถานะ "ยังไม่ได้ตั้งค่า" ไว้ เพื่อให้หน้าเว็บรู้ว่าต้องเข้าสู่การตั้งค่า
  await persistSettings();

  updateHeaderUI();
  updateModeUI();
  page="settings";
  render();

  alert(
    "🔄 ล้างการตั้งค่าเครื่องเรียบร้อยแล้ว\n\n"+
    "ตอนนี้สามารถตั้งค่าระบบใหม่ได้ทันที\n\n"+
    "หมายเหตุ: ข้อมูลใน Cloud และไฟล์ Offline เดิมไม่ได้ถูกลบ"
  );
}

function exportCSV(){
let rows=[["ID","คำนำหน้า","ชื่อ","นามสกุล","เลขบัตร","วันเกิด","ที่อยู่","โทรศัพท์","ชุมชน","ประเภท","ระดับ","สถานะ","หมายเหตุ"],...people.map(p=>[p.id,p.prefix,p.first,p.last,p.idcard,p.birth,p.address,p.phone,p.community,(p.types||[]).join(" / "),p.priority,p.status,p.note])];
let csv="\ufeff"+rows.map(r=>r.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(",")).join("\n");let blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="community-care-data.csv";a.click();URL.revokeObjectURL(url)
}
