<style>

*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:var(--text)}
button{cursor:pointer}
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.topin{max-width:1180px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.brand{font-weight:800}.brand small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.container{max-width:1180px;margin:auto;padding:18px 16px 60px}
.nav{display:flex;gap:8px;overflow:auto;padding:8px 0 16px}
.nav button{border:0;background:var(--nav-bg);color:var(--text);padding:11px 15px;border-radius:12px;white-space:nowrap}
.nav button.active{background:var(--primary);color:white}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat .n{font-size:28px;font-weight:800;margin-top:5px}.stat .l{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}.card h2,.card h3{margin:0 0 14px}
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.action{padding:20px;border:1px solid var(--line);background:var(--card);border-radius:16px;text-align:left}
.action b{display:block;font-size:17px}.action span{color:var(--muted);font-size:13px}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.row3{grid-template-columns:repeat(3,1fr)}
label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--input-border);border-radius:10px;background:var(--input-bg);color:var(--text)}

.full{grid-column:1/-1}

.table th{color:var(--muted);background:var(--th-bg)}
.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}
.urgent{background:var(--urgent-bg);color:var(--urgent-txt)}
.normal{background:var(--normal-bg);color:var(--normal-txt)}

.hidden{display:none!important}

.idphotos{display:grid;grid-template-columns:1fr 1fr;gap:12px}

@media(max-width:850px){.helpPhotos{grid-template-columns:1fr 1fr}.dateBE{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:repeat(3,1fr)}.row,.row3,.searchbar{grid-template-columns:1fr}.idphotos{grid-template-columns:1fr}}

/* ===== Mobile / Touch Optimization ===== */
html{overflow-x:hidden;-webkit-text-size-adjust:100%}
body{min-width:0;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
button,.btn,.action,input,select,textarea{min-height:44px}
button,.btn,.action{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea{font-size:16px} /* ป้องกัน iOS Safari ซูมเมื่อแตะช่องกรอก */
.top{padding-top:env(safe-area-inset-top)}
.topin{min-width:0}
.brand{min-width:0;flex:1}
.brand small{line-height:1.45}
.nav{-webkit-overflow-scrolling:touch;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.tablewrap{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.photo,.helpPhoto{min-width:0}
.photo img,.helpPhoto img{width:100%;height:auto;object-fit:contain}
.btns{align-items:stretch}
.btns .btn{flex:0 1 auto}
.choice label{min-height:44px;display:flex;align-items:center}
.choice input{min-height:auto}
#mediaModal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.82);display:none;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);overflow:auto}
#mediaModal.open{display:flex;align-items:flex-start;justify-content:center}
#mediaModal .mediaBox{width:min(100%,980px);margin:12px auto;background:var(--card);color:var(--text);border-radius:16px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#mediaModal .mediaHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;position:sticky;top:0;background:var(--card);z-index:1;padding-bottom:6px}
#mediaModal .mediaGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
#mediaModal .mediaCard{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--photo-bg)}
#mediaModal .mediaCard img{width:100%;max-height:70vh;object-fit:contain;border-radius:8px;background:var(--bg)}

  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .actions{grid-template-columns:repeat(2,minmax(0,1fr))}
  .action{padding:15px 12px;min-height:105px}
  .action b{font-size:15px}
  .action span{font-size:12px;line-height:1.4}
  .card{padding:12px;margin-top:10px;border-radius:14px}
  .card h2{font-size:20px}
  .card h3{font-size:16px}
  .row,.row3,.searchbar{grid-template-columns:1fr}
  .dateBE{grid-template-columns:1fr 1fr}
  .dateBE input{grid-column:1/-1}
  .idphotos,.helpPhotos{grid-template-columns:1fr}
  .btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .btns .btn{width:100%}
  .btns .btn:only-child{grid-column:1/-1}
  .photo .btns,.helpPhoto .btns{display:grid;grid-template-columns:1fr 1fr}
  .stat{padding:12px}
  .stat .n{font-size:22px}
  .stat .l{font-size:12px;line-height:1.35}
  .table{min-width:0}
  /* เปลี่ยนตารางรายชื่อเป็นการ์ดบนมือถือ */
  .table thead{display:none}
  .table,.table tbody,.table tr,.table td{display:block;width:100%}
  .table tr{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:8px}
  .table td{border:0;border-bottom:1px dashed var(--line);padding:8px 6px;text-align:left;font-size:13px;min-height:0}
  .table td:last-child{border-bottom:0}
  .table td::before{content:attr(data-label);display:block;color:var(--muted);font-size:11px;font-weight:700;margin-bottom:3px}

  .table td:first-child{padding-top:4px}
  .table td:last-child{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .table td:last-child::before{grid-column:1/-1}
  .table td:last-child .btn{width:100%}
  #mediaModal .mediaBox{margin:0;border-radius:0;min-height:100%;padding:12px}
  #mediaModal .mediaGrid{grid-template-columns:1fr}
  #mediaModal .mediaCard img{max-height:60vh}
}
@media(max-width:380px){
  .grid,.actions{grid-template-columns:1fr}
  .btns{grid-template-columns:1fr}
  .photo .btns,.helpPhoto .btns{grid-template-columns:1fr}
}
@media(hover:none){
  .btn:hover,.action:hover{transform:none}
}

.passwordMask{letter-spacing:3px;font-weight:700}

<script>
const DEFAULT_API = "";
const DEFAULT_COMMUNITIES = [];
const DEFAULT_TYPES = ["พิการ","ผู้ป่วยติดเตียง","ผู้สูงอายุ","ฐานะยากลำบาก"];
const DEFAULT_HELPS = ["ถุงยังชีพ","อุปกรณ์การแพทย์","หน่วยงานอื่นๆ"];
const DEFAULT_HEADER = "ระบบจัดการข้อมูลผู้ขอรับความช่วยเหลือในชุมชน • หมู่10 ตำบลบางคูวัด อำเภอเมือง จังหวัดปทุมธานี";
const DEFAULT_NAME = "Community Care Version 1.0";
const DB_NAME="CommunityCareDB", DB_VERSION=1;
let settings={apiUrl:"",communities:[],types:DEFAULT_TYPES.slice(),helps:DEFAULT_HELPS.slice(),brandName:DEFAULT_NAME,brandSub:DEFAULT_HEADER,configured:false,cloudEnabled:false,theme:"light",folderName:"",auth:null};
let API_URL="", communities=DEFAULT_COMMUNITIES.slice(), types=DEFAULT_TYPES.slice(), helps=DEFAULT_HELPS.slice();
let people=[], help=[], statuses=[], page="home", editId=null, db=null, dbReady=false, isConfigured=false, selectedFolderName="";
let authenticated=false;
let authMode="login";
let authChallengeBusy=false;

function setCloudStatus(message){
  const el=document.getElementById("cloudStatus");
  if(el) el.textContent=String(message||"");
}

function updateHeaderUI(){
  document.getElementById("brandTitle").textContent = settings.brandName || DEFAULT_NAME;
  document.getElementById("brandSub").textContent = settings.brandSub || DEFAULT_HEADER;
}

function toggleTheme() {
  const root = document.documentElement;
  const btn = document.getElementById("themeToggle");
  if(root.getAttribute("data-theme") === "dark") {
    root.removeAttribute("data-theme");
    settings.theme="light"; persistSettings();
    if(btn) btn.textContent = "🌙 โหมดมืด";
  } else {
    root.setAttribute("data-theme", "dark");
    settings.theme="dark"; persistSettings();
    if(btn) btn.textContent = "☀️ โหมดสว่าง";
  }
}

document.addEventListener("DOMContentLoaded", async () => {
  try {
    await initDB();
    await loadSettings();
    // การเปิดระบบครั้งแรกจะยังไม่ถือ IndexedDB เป็นฐานข้อมูลหลัก
    // แหล่งข้อมูลหลักต้องเป็นแหล่งที่ผู้ใช้ยืนยันในการตั้งค่าครั้งแรกเท่านั้น
    if(isConfigured && settings.cloudEnabled && settings.apiUrl){
      people=[]; help=[]; statuses=[];
      const ok=await loadCloud(true);
      if(!ok){
        // เก็บค่าการตั้งค่าเดิมไว้ แต่ไม่ถือว่าระบบพร้อมใช้งานจนกว่าจะเชื่อมต่อสำเร็จ
        isConfigured=false;
        setCloudStatus("⚠️ เชื่อมต่อ Cloud ไม่สำเร็จ • กรุณาตรวจสอบการตั้งค่า");
      }
    }else if(isConfigured && settings.folderHandle){
      people=[]; help=[]; statuses=[];
      const ok=await loadFolderData(false);
      if(!ok){
        // สำคัญ: ห้ามลบสถานะการตั้งค่าของเครื่องเพียงเพราะ Browser ยังไม่อนุญาต
        // File System Access ในการเปิดหน้าเว็บอัตโนมัติ (ต้องเกิดจาก user gesture)
        await loadLocalData();
        setCloudStatus("⚠️ Offline • ต้องอนุญาตโฟลเดอร์เมื่อพร้อมใช้งาน");
      }
    }else if(isConfigured){
      // การตั้งค่าถูกเก็บไว้ในเครื่องแล้ว แม้ไม่มี folderHandle ให้ถือว่ายังเป็นเครื่องเดิม
      // และใช้ IndexedDB เป็นข้อมูลชั่วคราวจนกว่าจะเลือก/เชื่อมโฟลเดอร์อีกครั้ง
      await loadLocalData();
      setCloudStatus("📱 Offline • การตั้งค่าเดิมของเครื่องถูกเก็บไว้แล้ว");
    }else{
      people=[]; help=[]; statuses=[];
    }
    updateHeaderUI();
    updateModeUI();
    authenticated=!isConfigured;
    render();
    if(isConfigured){
      authenticated=false;
      showLoginGate();
    }
  } catch(e){ console.error(e); alert("ไม่สามารถเปิดฐานข้อมูลได้: "+e.message); }
});

function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains("settings"))d.createObjectStore("settings",{keyPath:"key"});if(!d.objectStoreNames.contains("people"))d.createObjectStore("people",{keyPath:"id"});if(!d.objectStoreNames.contains("help"))d.createObjectStore("help",{keyPath:"id"});if(!d.objectStoreNames.contains("statuses"))d.createObjectStore("statuses",{keyPath:"id"});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error("เปิด IndexedDB ไม่สำเร็จ"));});}
async function initDB(){db=await openDB();dbReady=true;}
function store(n,m="readonly"){return db.transaction(n,m).objectStore(n)}
function idbPut(n,v){return new Promise((res,rej)=>{let r=store(n,"readwrite").put(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function idbGet(n,k){return new Promise((res,rej)=>{let r=store(n).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbAll(n){return new Promise((res,rej)=>{let r=store(n).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function idbClear(n){return new Promise((res,rej)=>{let r=store(n,"readwrite").clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
const DEVICE_CONFIG_KEY="communityCareDeviceConfigV1";
function getDeviceConfig(){try{return JSON.parse(localStorage.getItem(DEVICE_CONFIG_KEY)||"null")}catch(e){return null}}
function saveDeviceConfig(){try{const c={configured:!!settings.configured,cloudEnabled:!!settings.cloudEnabled,apiUrl:settings.apiUrl||"",folderName:settings.folderName||"",theme:settings.theme||"light",brandName:settings.brandName||DEFAULT_NAME,brandSub:settings.brandSub||DEFAULT_HEADER,communities:settings.communities||DEFAULT_COMMUNITIES.slice(),types:settings.types||DEFAULT_TYPES.slice(),helps:settings.helps||DEFAULT_HELPS.slice(),savedAt:new Date().toISOString()};localStorage.setItem(DEVICE_CONFIG_KEY,JSON.stringify(c))}catch(e){console.warn("saveDeviceConfig",e)}}
async function persistSettings(){if(dbReady)await idbPut("settings",{key:"app",value:settings});saveDeviceConfig()}
async function loadSettings(){const x=await idbGet("settings","app");if(x?.value)settings=Object.assign(settings,x.value);settings.communities=Array.isArray(settings.communities)?settings.communities.map(v=>String(v).trim()).filter(Boolean):[];if(settings.brandName==="Community Care Version 1.0 Offline"){settings.brandName=DEFAULT_NAME;try{await idbPut("settings",{key:"app",value:settings})}catch(e){console.warn("migrate brandName",e)}}const device=getDeviceConfig();if(device?.configured && !settings.configured)settings=Object.assign(settings,device);isConfigured=!!settings.configured;API_URL=settings.cloudEnabled?settings.apiUrl||"":"";communities=settings.communities?.length?settings.communities:DEFAULT_COMMUNITIES.slice();types=settings.types?.length?settings.types:DEFAULT_TYPES.slice();helps=settings.helps?.length?settings.helps:DEFAULT_HELPS.slice();selectedFolderName=settings.folderName||"";if(settings.auth&&typeof settings.auth==="object"){settings.auth.email=String(settings.auth.email||"").trim().toLowerCase();settings.auth.salt=String(settings.auth.salt||"");settings.auth.hash=String(settings.auth.hash||"")}else settings.auth=null;if(settings.theme==="dark")document.documentElement.setAttribute("data-theme","dark")}
async function loadLocalData(){people=await idbAll("people");help=await idbAll("help");statuses=await idbAll("statuses")}
const DATA_FILE_NAME="community-care-data.json";
async function getStoredDirectoryHandle(){
  try{return settings.folderHandle||null}catch(e){return null}
}
async function ensureFolderPermission(handle,write=false){
  if(!handle)return false;
  try{
    const mode=write?"readwrite":"read";
    if(handle.queryPermission){
      const q=await handle.queryPermission({mode});
      if(q==="granted")return true;
      if(handle.requestPermission){const r=await handle.requestPermission({mode});return r==="granted";}
      return false;
    }
    return true;
  }catch(e){return false}
}
async function loadFolderData(showMessage=false){
  const h=await getStoredDirectoryHandle();
  if(!h)return false;
  if(!(await ensureFolderPermission(h,false))){
    if(showMessage)setCloudStatus("⚠️ Offline • ไม่ได้รับสิทธิ์เข้าถึงโฟลเดอร์ข้อมูล");
    return false;
  }
  try{
    const f=await h.getFileHandle(DATA_FILE_NAME,{create:false});
    const file=await f.getFile();
    const text=await file.text();
    if(!text.trim())return false;
    const d=JSON.parse(text);
    if(!Array.isArray(d.people)||!Array.isArray(d.help)||!Array.isArray(d.statuses))throw new Error("ไฟล์ข้อมูลเดิมไม่ถูกต้อง");
    people=d.people; help=d.help; statuses=d.statuses;
    if(d.settings?.auth) settings.auth=d.settings.auth;
    if(d.settings?.communities) settings.communities=d.settings.communities;
    if(d.settings?.types) settings.types=d.settings.types;
    if(d.settings?.helps) settings.helps=d.settings.helps;
    communities=settings.communities?.length?settings.communities:DEFAULT_COMMUNITIES.slice();
    types=settings.types?.length?settings.types:DEFAULT_TYPES.slice();
    helps=settings.helps?.length?settings.helps:DEFAULT_HELPS.slice();
    // เก็บสำเนาใน IndexedDB เป็น cache เท่านั้น ไม่ใช่แหล่งข้อมูลหลักเมื่อเลือกโฟลเดอร์
    await cacheLocalData();
    setCloudStatus("📱 Offline • โหลดข้อมูลเดิมจากไฟล์สำเร็จ ("+people.length+" รายการ)");
    return true;
  }catch(e){
    if(e.name==="NotFoundError")return false;
    console.error("loadFolderData",e);
    if(showMessage)alert("ไม่สามารถอ่านไฟล์ข้อมูลเดิมในโฟลเดอร์ได้\n\n"+e.message);
    return false;
  }
}
async function cacheLocalData(){for(const [n,a] of [["people",people],["help",help],["statuses",statuses]]){await idbClear(n);for(const x of a)await idbPut(n,x)}}
async function writeFolderData(){
  const h=await getStoredDirectoryHandle();
  if(!h)return false;
  if(!(await ensureFolderPermission(h,true)))throw new Error("ไม่ได้รับสิทธิ์เขียนไฟล์ในโฟลเดอร์");
  const f=await h.getFileHandle(DATA_FILE_NAME,{create:true});
  const w=await f.createWritable();
  const payload={version:1,updatedAt:new Date().toISOString(),settings:{brandName:settings.brandName,brandSub:settings.brandSub,communities:settings.communities,types:settings.types,helps:settings.helps,auth:settings.auth},people,help,statuses};
  await w.write(JSON.stringify(payload,null,2));
  await w.close();
  return true;
}
async function save(){
  // IndexedDB เป็น cache เสมอ; แหล่งข้อมูลหลักถูกเลือกตอนตั้งค่าครั้งแรก
  await cacheLocalData();

  // เมื่อเลือก Cloud เป็นฐานข้อมูลหลัก ทุกการบันทึกข้อมูลต้องส่งขึ้น Cloud อัตโนมัติ
  // ไม่จำเป็นต้องกดปุ่ม "เชื่อมเครือข่ายออนไลน์" ซ้ำทุกครั้ง
  if(settings.cloudEnabled && String(settings.apiUrl||"").trim()){
    try{
      setCloudStatus("☁️ Online • กำลังบันทึกข้อมูลขึ้น Cloud…");
      await postCloud({action:"saveAll",people,help,statuses});
      API_URL=settings.apiUrl;
      setCloudStatus("☁️ Online • บันทึกข้อมูลขึ้น Cloud สำเร็จ");
      return;
    }catch(e){
      setCloudStatus("⚠️ Online • ส่งข้อมูลขึ้น Cloud ไม่สำเร็จ");
      throw new Error("ไม่สามารถส่งข้อมูลขึ้น Cloud ได้: "+e.message);
    }
  }

  // Offline: เขียนลงไฟล์หลักในโฟลเดอร์
  if(settings.folderHandle){
    try{
      await writeFolderData();
      setCloudStatus("📱 Offline • บันทึกลงไฟล์ข้อมูลแล้ว");
      return;
    }catch(e){
      setCloudStatus("⚠️ Offline • บันทึกไฟล์ไม่สำเร็จ");
      throw e;
    }
  }

  setCloudStatus("📱 Offline • บันทึกใน IndexedDB แล้ว");
}
async function cloudSync(){
  if(!isConfigured){alert("กรุณาตั้งค่าฐานข้อมูลก่อนใช้งาน Cloud");return}
  if(!settings.cloudEnabled||!settings.apiUrl){alert("ยังไม่ได้เปิดใช้งาน Cloud ในตั้งค่าระบบ");return}
  try{
    setCloudStatus("☁️ กำลังส่งข้อมูลขึ้น Cloud…");
    await cloudRequest("saveAll",{people,help,statuses});
    await loadCloud(false);
    setCloudStatus("☁️ Online • ซิงค์ Cloud สำเร็จ");
    render();
  }catch(e){
    setCloudStatus("⚠️ Online • ซิงค์ไม่สำเร็จ");
    alert("ซิงค์ Cloud ไม่สำเร็จ: "+e.message+"\n\nข้อมูลในเครื่องยังคงอยู่");
  }
}
async function postCloud(payload){
  const action=String(payload?.action||"");
  const body=Object.assign({},payload||{});
  delete body.action;
  return cloudRequest(action,body);
}
function parseCloudResponse(text){
  let d;
  try{d=typeof text==="string"?JSON.parse(text):text}catch(e){throw new Error("Google Apps Script ส่งข้อมูลกลับมาไม่ใช่ JSON")}
  if(d?.data && typeof d.data==="object") d=d.data;
  if(d?.result && typeof d.result==="object") d=d.result;
  if(!Array.isArray(d?.people)||!Array.isArray(d?.help)||!Array.isArray(d?.statuses)){
    throw new Error("ไม่พบข้อมูล people/help/statuses จาก Google Apps Script");
  }
  return d;
}

async function cloudRequest(action, payload=null){
  const target=String(settings.apiUrl||"").trim();
  if(!target) throw new Error("ยังไม่ได้ระบุ Google Apps Script Web App URL");

  // If this HTML is hosted on Cloudflare Pages and a same-origin proxy exists,
  // use it to avoid browser CORS/redirect problems with Google Apps Script.
  const proxyPath="/api/cloud";

  // เมื่อหน้าเว็บถูกเปิดจาก Cloudflare/HTTPS ให้ใช้ /api/cloud เสมอ
  // ห้ามตรวจเฉพาะ *.pages.dev เพราะผู้ใช้อาจใช้ Custom Domain ของ Cloudflare
  // หากเรียก Google Apps Script ตรงจาก Browser จะเกิด CORS/redirect และขึ้น "Failed to fetch"
  const useProxy=location.protocol==="https:" ||
                 location.hostname.endsWith(".pages.dev") ||
                 location.hostname==="localhost" ||
                 location.hostname==="127.0.0.1";

  if(useProxy){
    const r=await fetch(proxyPath,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({target,action,payload})
    });
    const t=await r.text();
    if(!r.ok){
      if(r.status===404){
        throw new Error("ไม่พบ Cloudflare Function /api/cloud — ต้องนำไฟล์ functions/api/cloud.js ไป Deploy พร้อมเว็บไซต์ก่อน");
      }
      throw new Error("Cloudflare Proxy HTTP "+r.status+(t?": "+t:""));
    }
    try{return JSON.parse(t)}catch(e){throw new Error("Cloudflare Proxy ส่งข้อมูลกลับมาไม่ใช่ JSON")}
  }

  // Direct fallback for environments where the page is not using the proxy.
  if(action==="getAll"){
    const r=await fetch(target+(target.includes("?")?"&":"?")+"action=getAll&t="+Date.now(),{method:"GET",cache:"no-store"});
    const t=await r.text();
    if(!r.ok) throw new Error("Google Apps Script HTTP "+r.status);
    try{return JSON.parse(t)}catch(e){throw new Error("Google Apps Script ส่งข้อมูลกลับมาไม่ใช่ JSON")}
  }

  const r=await fetch(target,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(Object.assign({action},payload||{}))
  });
  const t=await r.text();
  if(!r.ok) throw new Error("Google Apps Script HTTP "+r.status);
  try{return JSON.parse(t)}catch(e){throw new Error("Google Apps Script ส่งข้อมูลกลับมาไม่ใช่ JSON")}
}

function cloudGetUrl(){
  const base=String(settings.apiUrl||"").trim();
  if(!base)return "";
  return base+(base.includes("?")?"&":"?")+"action=getAll&t="+Date.now();
}
async function loadCloud(showMessage=true){
  if(!settings.cloudEnabled||!settings.apiUrl)return false;
  try{
    if(showMessage)setCloudStatus("☁️ Online • กำลังโหลดข้อมูลเดิมจาก Cloud…");
    const response=await cloudRequest("getAll");
    const d=parseCloudResponse(response);
    people=d.people; help=d.help; statuses=d.statuses;
    if(d.auth) settings.auth=d.auth;
    if(Array.isArray(d.settings?.communities)) settings.communities=d.settings.communities;
    if(Array.isArray(d.settings?.types)) settings.types=d.settings.types;
    if(Array.isArray(d.settings?.helps)) settings.helps=d.settings.helps;

    // ฐานข้อมูลรุ่นเก่าอาจไม่มี settings.* ให้สร้างรายการจากข้อมูลจริง
    if(!settings.communities?.length && Array.isArray(d.people)){
      settings.communities=[...new Set(
        d.people.map(p=>String(p?.community||"").trim()).filter(Boolean)
      )];
    }
    if(!settings.types?.length && Array.isArray(d.people)){
      settings.types=[...new Set(
        d.people.flatMap(p=>Array.isArray(p?.types)?p.types:[p?.types])
          .map(x=>String(x||"").trim()).filter(Boolean)
      )];
    }
    if(!settings.helps?.length && Array.isArray(d.help)){
      settings.helps=[...new Set(
        d.help.flatMap(h=>Array.isArray(h?.types)?h.types:[h?.types])
          .map(x=>String(x||"").trim()).filter(Boolean)
      )];
    }

    communities=settings.communities?.length?settings.communities:communities;
    types=settings.types?.length?settings.types:types;
    helps=settings.helps?.length?settings.helps:helps;

    if(communities.length){
      existingCloudCommunitiesLocked=true;
      existingCloudCommunities=communities.slice();
      const ce=document.getElementById("setCommunities");
      if(ce){ ce.value=communities.join(", "); ce.readOnly=true; }
    }
    // โหลดจาก Cloud แล้วเก็บไว้เป็น cache เท่านั้น ห้ามเรียก save()
    // เพราะ save() จะส่งข้อมูลกลับขึ้น Cloud อีกครั้งโดยไม่จำเป็น
    await cacheLocalData();
    setCloudStatus("☁️ Online • โหลดข้อมูลเดิมจาก Cloud สำเร็จ ("+people.length+" รายการ)");
    return true;
  }catch(e){
    console.error("loadCloud",e);
    setCloudStatus("⚠️ Online • โหลด Cloud ไม่สำเร็จ");
    if(showMessage)alert("ไม่สามารถดึงข้อมูลเดิมจาก Google Apps Script ได้\n\n"+e.message+"\n\nข้อมูล Offline ในเครื่องจะไม่ถูกลบ");
    return false;
  }
}

function id(prefix){return prefix+"-"+Date.now().toString().slice(-8)}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function parseBirthDate(d){
  if(!d)return null;
  let parts=String(d).split("-");
  if(parts.length!==3)return null;
  let y=Number(parts[0]),m=Number(parts[1]),day=Number(parts[2]);
  if(!y||!m||!day)return null;
  let dt=new Date(y,m-1,day);
  if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==day)return null;
  return dt;
}
function age(d){
  let b=parseBirthDate(d);
  if(!b)return"";
  let n=new Date();
  let a=n.getFullYear()-b.getFullYear();
  if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;
  return a>=0?a:"";
}

function updateBirth(){
  const day=document.getElementById("birthDay")?.value||"";
  const month=document.getElementById("birthMonth")?.value||"";
  const yearBE=(document.getElementById("birthYearBE")?.value||"").replace(/\D/g,"");
  const ageBox=document.getElementById("age");
  const birthBox=document.getElementById("birth");

  if(day && month && yearBE.length===4){
    const gy=Number(yearBE)-543;
    const iso=`${gy}-${month}-${day}`;
    const b=parseBirthDate(iso);

    if(b && gy>=1900 && gy<=new Date().getFullYear()){
      birthBox.value=iso;
      ageBox.value=age(iso);
      return;
    }
  }
  birthBox.value="";
  ageBox.value="";
}
function setBirthFields(iso){
  if(!iso)return;
  let [y,m,d]=iso.split("-");
  const day=document.getElementById("birthDay"), month=document.getElementById("birthMonth"), year=document.getElementById("birthYearBE");
  if(day&&month&&year){
    day.value=d; month.value=m; year.value=Number(y)+543;
    document.getElementById("birth").value=iso;
    document.getElementById("age").value=age(iso);
  }
}

function helpPhoto(e,n){
  let f=e.target.files[0]; if(!f)return;
  let r=new FileReader();
  r.onload=()=>{
    let img=new Image();
    img.onload=()=>{
      let c=document.createElement("canvas"),max=1200,s=Math.min(1,max/img.width);
      c.width=img.width*s;c.height=img.height*s;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      let data=c.toDataURL("image/jpeg",.75);
      let box=document.getElementById("helpPhotoPreview"+n);
      box.innerHTML=`<img src="${data}"><div class="muted" style="margin-top:6px">บันทึกเป็นรูปการช่วยเหลือ ${n}</div>`;
      box.dataset.data=data;
    };
    img.src=r.result;
  };
  r.readAsDataURL(f);
}

function photo(e,which){
  let f=e.target.files[0]; if(!f)return;
  let r=new FileReader();
  r.onload=()=>{
    let img=new Image();
    img.onload=()=>{
      let c=document.createElement("canvas"),max=900,s=Math.min(1,max/img.width);
      c.width=img.width*s;c.height=img.height*s;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      let data=c.toDataURL("image/jpeg",.7);
      let box=document.getElementById(which+"Preview");
      box.innerHTML=`<img src="${data}">`;
      box.dataset.data=data;
    };
    img.src=r.result;
  };
  r.readAsDataURL(f);
}
async function tryOCR(){
let m=document.getElementById("ocrmsg");m.textContent="กำลังเตรียม OCR…";
if(!window.Tesseract){let s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";document.head.appendChild(s);await new Promise((res,rej)=>{s.onload=res;s.onerror=rej})}
let img=document.querySelector("#frontPreview img");if(!img){m.textContent="กรุณาถ่าย/เลือกภาพบัตรด้านหน้าก่อน";return}
m.textContent="กำลังอ่านภาพ อาจใช้เวลาสักครู่…";
try{let {data}=await Tesseract.recognize(img.src,"tha+eng");document.getElementById("note").value=(document.getElementById("note").value?document.getElementById("note").value+"\n":"")+"[OCR ข้อความดิบ] "+data.text; m.textContent="อ่านภาพเสร็จแล้ว ระบบใส่ข้อความ OCR ไว้ในหมายเหตุเพื่อให้ตรวจสอบก่อนนำไปใช้";}catch(e){m.textContent="OCR ไม่สำเร็จ กรุณากรอกข้อมูลด้วยตนเอง"}}

if(!first||!last||!community||!ts.length||!priority){alert("กรุณากรอกข้อมูลที่มีเครื่องหมาย * ให้ครบ");return}
let front=document.getElementById("frontPreview")?.dataset.data || document.querySelector("#frontPreview img")?.src || "";
let back=document.getElementById("backPreview")?.dataset.data || document.querySelector("#backPreview img")?.src || "";
let data={id:editId||id("P"),prefix:document.getElementById("prefix").value,first,last,idcard:document.getElementById("idcard").value.trim(),birth:document.getElementById("birth").value,address:document.getElementById("address").value.trim(),phone:document.getElementById("phone").value.trim(),relative:document.getElementById("relative").value.trim(),relativePhone:document.getElementById("relativePhone").value.trim(),community,otherCommunity:document.getElementById("otherCommunity")?.value.trim()||"",types:ts,priority,note:document.getElementById("note").value.trim(),front,back,status:"active",createdAt:editId?(people.find(x=>x.id===editId)?.createdAt||new Date().toISOString()):new Date().toISOString(),updatedAt:new Date().toISOString()};
if(editId){let i=people.findIndex(x=>x.id===editId);people[i]=data}else people.push(data);save().then(()=>{alert(settings.cloudEnabled?"✅ บันทึกข้อมูลและส่งขึ้น Cloud สำเร็จ":"✅ บันทึกข้อมูล Offline สำเร็จ");setPage("manage")}).catch(e=>alert("บันทึกไม่สำเร็จ: "+e.message))}

function openMediaModal(title, cards){
  const modal=document.getElementById("mediaModal");
  const titleEl=document.getElementById("mediaTitle");
  const content=document.getElementById("mediaContent");
  if(!modal||!content)return;
  titleEl.textContent=title||"รูปภาพ";
  content.innerHTML=`<div class="mediaGrid">${cards.join("")}</div>`;
  modal.classList.add("open");
  modal.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
}
function closeMediaModal(){
  const modal=document.getElementById("mediaModal");
  if(!modal)return;
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden","true");
  document.body.style.overflow="";
  document.getElementById("mediaContent").innerHTML="";
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMediaModal()});

function showIdPhotos(pid){
  let p=people.find(x=>x.id===pid);
  if(!p||(!p.front&&!p.back)){alert("ยังไม่มีรูปบัตรประชาชน");return}
  let cards=[];
  if(p.front)cards.push(`<div class="mediaCard"><h3>ด้านหน้า</h3><img src="${p.front}" alt="บัตรประชาชนด้านหน้า"></div>`);
  if(p.back)cards.push(`<div class="mediaCard"><h3>ด้านหลัง</h3><img src="${p.back}" alt="บัตรประชาชนด้านหลัง"></div>`);
  openMediaModal(`🪪 บัตรประชาชน • ${esc(p.prefix)}${esc(p.first)} ${esc(p.last)}`,cards);
}

function showHelpPhotos(pid){
  let p=people.find(x=>x.id===pid), hs=help.filter(h=>h.personId===pid);
  if(!p||!hs.length){alert("ยังไม่มีประวัติการช่วยเหลือ");return}
  let lines=hs.flatMap(h=>(h.photos||[]).map(ph=>({date:h.date,types:(h.types||[]).join(", "),agency:h.agency||"-",data:ph.data,name:ph.name||"รูปการช่วยเหลือ"})));
  if(!lines.length){alert("เคสนี้ยังไม่มีรูปการช่วยเหลือ");return}
  let cards=lines.map(x=>`<div class="mediaCard"><img src="${x.data}" alt="${esc(x.name)}"><b>${esc(x.date||"-")}</b><div class="muted">${esc(x.types)} • ${esc(x.agency)}</div><div class="muted">${esc(x.name)}</div></div>`);
  openMediaModal(`📷 รูปการช่วยเหลือ • ${esc(p.prefix)}${esc(p.first)} ${esc(p.last)}`,cards);
}

function editPerson(i){
  let p=people.find(x=>x.id===i);
  if(!p){alert("ไม่พบข้อมูลที่ต้องการแก้ไข");return}
  editId=i;
  page="add";
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page==="add"));
  render();
  setTimeout(()=>setBirthFields(p.birth||""),0);
}
function statusPerson(i){
  let p=people.find(x=>x.id===i);
  if(!p)return;
  let s=prompt("ระบุสถานะ: เสียชีวิต / ย้าย / อื่นๆ","ย้าย");
  if(!s)return;
  s=s.trim();
  if(!["เสียชีวิต","ย้าย","อื่นๆ"].includes(s)){alert("กรุณาใช้ เสียชีวิต, ย้าย หรือ อื่นๆ");return}
  let note=prompt("หมายเหตุเพิ่มเติม","")||"";
  p.status="inactive";
  statuses.push({id:id("ST"),personId:i,name:p.first+" "+p.last,status:s,note,date:new Date().toISOString()});
  save().then(()=>render()).catch(e=>alert("บันทึกไม่สำเร็จ: "+e.message));
}

async function bytesToHex(buf){return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("")}
function randomHex(bytes=16){const a=new Uint8Array(bytes);crypto.getRandomValues(a);return Array.from(a).map(b=>b.toString(16).padStart(2,"0")).join("")}
async function hashPassword(password,saltHex){const enc=new TextEncoder();const salt=Uint8Array.from((saltHex.match(/.{2}/g)||[]).map(x=>parseInt(x,16)));const key=await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveBits"]);const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:120000,hash:"SHA-256"},key,256);return bytesToHex(bits)}

/* ===== Existing Login protection =====
   If the selected database already contains Login credentials,
   Email/Password must not be editable. Saving settings keeps the
   existing credentials unchanged. */
let existingAuthLoaded = false;
let existingAuthEmail = "";

function applyExistingAuthLock() {
  const hasExisting = existingAuthLoaded || !!(settings.auth?.email && settings.auth?.hash && settings.auth?.salt);
  const emailEl = document.getElementById("setAuthEmail") ||
                  document.getElementById("setLoginEmail") ||
                  document.getElementById("authEmail") ||
                  document.getElementById("loginEmail");
  const passEl = document.getElementById("setAuthPassword") ||
                 document.getElementById("setLoginPassword") ||
                 document.getElementById("authPassword") ||
                 document.getElementById("loginPassword");
  if (hasExisting) {
    if (emailEl) {
      emailEl.value = existingAuthEmail || emailEl.value || "";
      emailEl.readOnly = true;
      emailEl.setAttribute("aria-readonly","true");
      emailEl.title = "มีข้อมูล Login เดิมในฐานข้อมูล ไม่สามารถแก้ไขได้";
    }
    if (passEl) {
      passEl.value = "";
      passEl.placeholder = "******";
      passEl.readOnly = true;
      passEl.setAttribute("aria-readonly","true");
      passEl.title = "มีรหัสผ่านเดิมในฐานข้อมูล ไม่สามารถแก้ไขได้";
    }
  }
}


// เมื่อพบฐานข้อมูลเดิม: ใช้รายชื่อชุมชนเดิมเป็นข้อมูลหลัก
// แต่ไม่บังคับให้ผู้ใช้ดึง/กรอก/แก้ไขรายชื่อในหน้าตั้งค่า
let existingCloudCommunitiesLocked = false;
let existingCloudCommunities = [];

function applyExistingCommunityLock(){
  const el = document.getElementById("setCommunities");
  if(!el) return;
  const savedCloudCommunities = Array.isArray(settings.communities) && settings.communities.length && settings.cloudEnabled;
  if(existingCloudCommunitiesLocked || savedCloudCommunities){
    const source = existingCloudCommunities.length ? existingCloudCommunities : settings.communities;
    const list = source.map(x=>String(x).trim()).filter(Boolean);
    if(list.length){
      existingCloudCommunitiesLocked=true;
      existingCloudCommunities=list.slice();
      el.value=list.join(", ");
      el.readOnly=true;
      el.setAttribute("aria-readonly","true");
      el.title="ฐานข้อมูลเดิมมีรายชื่อชุมชน/โซนแล้ว ระบบจะใช้รายการเดิมโดยไม่ให้แก้ไข";
    }
  }
}

async function saveSettings(){
  const bSubEl=document.getElementById("setBrandSub");
  const apiEl=document.getElementById("setApiUrl");
  const cloudEl=document.getElementById("setCloudEnabled");
  const emailEl=document.getElementById("setAuthEmail");
  const passEl=document.getElementById("setAuthPassword");
  const commEl=document.getElementById("setCommunities");
  const typeEl=document.getElementById("setTypes");
  const helpEl=document.getElementById("setHelps");

  const bSub=(bSubEl?.value||"").trim();
  const api=(apiEl?.value||"").trim();
  const cloud=!!cloudEl?.checked;

  // อ่าน Login จากหน้าจอ แต่ถ้าฐานข้อมูล Cloud มี Login เดิม
  // ให้ใช้ของเดิมทันทีและไม่บังคับกรอก Password ใหม่
  let authEmail=(emailEl?.value||"").trim().toLowerCase();
  let authPassword=passEl?.value||"";

  let cs=(commEl?.value||"").split(",").map(x=>x.trim()).filter(Boolean);
  let ts=(typeEl?.value||"").split(",").map(x=>x.trim()).filter(Boolean);
  let hs=(helpEl?.value||"").split(",").map(x=>x.trim()).filter(Boolean);
  let cloudOld=null;

  if(cloud && !api){
    alert("หากเปิด Cloud กรุณาระบุ URL");
    return;
  }

  // ------------------------------------------------------------------
  // 1) ONLINE: ตรวจฐานข้อมูลเดิมก่อนตรวจช่องตั้งค่า
  // ------------------------------------------------------------------
  if(cloud && api){
    try{
      setCloudStatus("☁️ กำลังตรวจสอบฐานข้อมูลเดิมจาก Cloud…");
      // ใช้ URL ที่ผู้ใช้เพิ่งกรอกทันที ก่อนที่จะสร้าง candidate settings
      const previousApiUrl=settings.apiUrl;
      settings.apiUrl=api;
      const dd=await cloudRequest("getAll");
      settings.apiUrl=previousApiUrl||api;
      cloudOld=dd?.data && typeof dd.data==="object" ? dd.data :
               dd?.result && typeof dd.result==="object" ? dd.result : dd;

      const oldSettings=cloudOld?.settings && typeof cloudOld.settings==="object" ? cloudOld.settings : {};

      // Login เดิม: ใช้ของฐานข้อมูลเป็นหลัก ห้ามแก้ไข
      if(cloudOld?.auth?.email && cloudOld?.auth?.salt && cloudOld?.auth?.hash){
        settings.auth=cloudOld.auth;
        authEmail=String(cloudOld.auth.email).trim().toLowerCase();
        authPassword="";
        existingAuthLoaded=true;
        existingAuthEmail=authEmail;
      }else if(oldSettings?.auth?.email && oldSettings?.auth?.salt && oldSettings?.auth?.hash){
        settings.auth=oldSettings.auth;
        authEmail=String(oldSettings.auth.email).trim().toLowerCase();
        authPassword="";
        existingAuthLoaded=true;
        existingAuthEmail=authEmail;
      }

      // settings ระดับบนสุดของฐานข้อมูลเดิม
      if(Array.isArray(cloudOld?.communities) && cloudOld.communities.length && !oldSettings.communities)
        oldSettings.communities=cloudOld.communities;
      if(Array.isArray(cloudOld?.types) && cloudOld.types.length && !oldSettings.types)
        oldSettings.types=cloudOld.types;
      if(Array.isArray(cloudOld?.helps) && cloudOld.helps.length && !oldSettings.helps)
        oldSettings.helps=cloudOld.helps;

      // ชุมชนเดิม: settings.communities ก่อน แล้วค่อย people.community
      let oldCommunities=Array.isArray(oldSettings.communities)
        ? oldSettings.communities.map(x=>String(x).trim()).filter(Boolean) : [];
      if(!oldCommunities.length && Array.isArray(cloudOld?.people)){
        oldCommunities=[...new Set(cloudOld.people.map(p=>String(p?.community||"").trim()).filter(Boolean))];
      }
      if(oldCommunities.length){
        existingCloudCommunitiesLocked=true;
        existingCloudCommunities=oldCommunities.slice();
        cs=oldCommunities.slice();
        communities=oldCommunities.slice();
        if(commEl){commEl.value=oldCommunities.join(", ");commEl.readOnly=true;commEl.setAttribute("aria-readonly","true");}
      }

      // ประเภทเดิม: settings.types ก่อน แล้วค่อย people.types
      let oldTypes=Array.isArray(oldSettings.types)
        ? oldSettings.types.map(x=>String(x).trim()).filter(Boolean) : [];
      if(!oldTypes.length && Array.isArray(cloudOld?.people)){
        oldTypes=[...new Set(cloudOld.people.flatMap(p=>Array.isArray(p?.types)?p.types:[p?.types]).map(x=>String(x||"").trim()).filter(Boolean))];
      }
      if(oldTypes.length){ts=oldTypes.slice();types=oldTypes.slice();if(typeEl)typeEl.value=oldTypes.join(", ");}

      // ประเภทการช่วยเหลือเดิม: settings.helps ก่อน แล้วค่อย help[].types
      let oldHelps=Array.isArray(oldSettings.helps)
        ? oldSettings.helps.map(x=>String(x).trim()).filter(Boolean) : [];
      if(!oldHelps.length && Array.isArray(cloudOld?.help)){
        oldHelps=[...new Set(cloudOld.help.flatMap(h=>Array.isArray(h?.types)?h.types:[h?.types]).map(x=>String(x||"").trim()).filter(Boolean))];
      }
      if(oldHelps.length){hs=oldHelps.slice();helps=oldHelps.slice();if(helpEl)helpEl.value=oldHelps.join(", ");}

      if(oldSettings.brandSub && bSubEl && !bSubEl.value.trim()) bSubEl.value=String(oldSettings.brandSub);
    }catch(e){
      console.error("ตรวจฐานข้อมูลเดิมจาก Cloud",e);
      // ไม่กลบค่าที่ผู้ใช้กรอก และไปตรวจต่อด้านล่าง
    }
  }

  // ------------------------------------------------------------------
  // 2) ค่าเริ่มต้น: Cloud เดิมไม่ต้องกรอกชุมชน/ประเภทใหม่
  // ------------------------------------------------------------------
  if(!cs.length) cs=Array.isArray(communities)&&communities.length?communities.slice():DEFAULT_COMMUNITIES.slice();
  if(!ts.length) ts=Array.isArray(types)&&types.length?types.slice():DEFAULT_TYPES.slice();
  if(!hs.length) hs=Array.isArray(helps)&&helps.length?helps.slice():DEFAULT_HELPS.slice();

  // ------------------------------------------------------------------
  // 3) Login: ถ้ามี Login เดิม ให้ผ่านได้แม้ช่อง Password ว่าง/ถูก mask
  //    ถ้ายังไม่มี Login จึงสร้างครั้งแรกจาก Email + Password
  // ------------------------------------------------------------------
  const validEmail=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(authEmail);
  if(existingAuthLoaded || settings.auth?.hash){
    authEmail=String(settings.auth?.email||existingAuthEmail||authEmail||"").trim().toLowerCase();
    if(!validEmail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(authEmail)){
      alert("ไม่พบ Email Login เดิมในฐานข้อมูล กรุณาตั้งค่า Email สำหรับเข้าสู่ระบบ");
      return;
    }
    authPassword="";
  }else{
    if(!validEmail){
      alert("กรุณากรอก Email สำหรับเข้าสู่ระบบให้ถูกต้อง");
      return;
    }
    if(authPassword.length<6){
      alert("กรุณาตั้ง Password อย่างน้อย 6 ตัวอักษร");
      return;
    }
  }

  if(!cloud&&!settings.folderHandle){
    alert("กรุณาเลือกโฟลเดอร์สำหรับฐานข้อมูล Offline ก่อน");
    return;
  }

  const oldSettingsState=settings;
  const oldConfigured=isConfigured;
  const oldAPI=API_URL;
  let newAuth=settings.auth;

  if(authPassword){
    newAuth=await createAuth(authEmail,authPassword);
  }else if(cloudOld?.auth){
    newAuth=cloudOld.auth;
  }else if(cloudOld?.settings?.auth){
    newAuth=cloudOld.settings.auth;
  }

  const candidate=Object.assign({},settings,{
    brandName:DEFAULT_NAME,
    brandSub:(bSubEl?.value||bSub||DEFAULT_HEADER).trim(),
    apiUrl:cloud?api:"",
    communities:cs,
    types:ts,
    helps:hs,
    configured:false,
    cloudEnabled:cloud,
    folderName:selectedFolderName||settings.folderName||"",
    auth:newAuth
  });

  settings=candidate;
  API_URL=cloud?api:"";
  communities=cs.slice();
  types=ts.slice();
  helps=hs.slice();
  isConfigured=true;
  people=[];help=[];statuses=[];

  try{
    if(cloud){
      setCloudStatus("☁️ กำลังตรวจสอบและดึงข้อมูลเดิมจาก Cloud ก่อนเปิดใช้งาน…");
      const ok=await loadCloud(true);
      if(!ok) throw new Error("เชื่อมต่อ Cloud หรือดึงข้อมูลเดิมไม่สำเร็จ กรุณาตรวจสอบ URL/การเผยแพร่ Web App และ Cloudflare Pages Function /api/cloud");

      // Cloud เป็นแหล่งข้อมูลหลักหลัง load สำเร็จ
      if(Array.isArray(settings.communities)&&settings.communities.length){
        communities=settings.communities.slice();
      }
      if(Array.isArray(settings.types)&&settings.types.length) types=settings.types.slice();
      if(Array.isArray(settings.helps)&&settings.helps.length) helps=settings.helps.slice();

      // ถ้า Cloud เดิมมี Login ให้คงไว้ ห้ามส่ง auth ใหม่ทับ
      const payload={
        action:"saveAuth",
        settings:{
          communities:communities,
          types:types,
          helps:helps,
          brandSub:settings.brandSub
        }
      };
      if(!settings.auth?.hash && newAuth) payload.auth=newAuth;

      const ad=await cloudRequest("saveAuth",payload);
      if(!ad.ok) throw new Error(ad.error||"ไม่สามารถบันทึกการตั้งค่าลง Cloud ได้");
    }else{
      if(!(await ensureFolderPermission(settings.folderHandle,true)))
        throw new Error("ไม่ได้รับสิทธิ์อ่าน/เขียนโฟลเดอร์");
      const loaded=await loadFolderData(false);
      if(!loaded){
        const f=await settings.folderHandle.getFileHandle(DATA_FILE_NAME,{create:false}).catch(e=>{if(e.name==="NotFoundError")return null;throw e});
        if(f) throw new Error("ไฟล์ข้อมูลเดิมไม่ถูกต้องหรืออ่านไม่ได้");
      }
      await writeFolderData();
    }

    settings.configured=true;
    isConfigured=true;
    authenticated=false;
    await persistSettings();
    updateHeaderUI();
    updateModeUI();
    render();

    alert(`✅ ตั้งค่าและตรวจสอบสำเร็จ\n\nโหมดการทำงาน: ${cloud?"☁️ Online • Google Apps Script เป็นฐานข้อมูลหลัก":"📱 Offline • community-care-data.json เป็นฐานข้อมูลหลัก"}\n\nรายชื่อชุมชน / โซนย่อย: ${communities.join(", ")}\n\nกรุณา Login ก่อนเริ่มใช้งาน`);
    setPage("home");
    showLoginGate();
  }catch(e){
    console.error("saveSettings",e);
    settings=oldSettingsState;
    isConfigured=oldConfigured;
    API_URL=oldAPI;
    communities=settings.communities?.length?settings.communities:DEFAULT_COMMUNITIES.slice();
    types=settings.types?.length?settings.types:DEFAULT_TYPES.slice();
    helps=settings.helps?.length?settings.helps:DEFAULT_HELPS.slice();
    people=[];help=[];statuses=[];
    updateHeaderUI();updateModeUI();render();
    alert("❌ ยังไม่เปิดใช้งานระบบ\n\n"+e.message+"\n\nการตั้งค่าที่ยังไม่ผ่านการตรวจสอบจะไม่ถูกบันทึกเป็นสถานะพร้อมใช้งาน");
  }
}
async function resetSettings(){
  if(!confirm(
    "ต้องการล้างการตั้งค่าเครื่องนี้หรือไม่?\n\n"+
    "ระบบจะล้างเฉพาะการตั้งค่า Online/Offline, URL Cloud, โฟลเดอร์ที่เลือก และค่าการตั้งค่าของเครื่องนี้\n"+
    "ข้อมูลผู้ขอรับความช่วยเหลือและข้อมูลการช่วยเหลือจะไม่ถูกลบ\n"+
    "ไฟล์ community-care-data.json และข้อมูลบน Cloud จะไม่ถูกลบ"
  )) return;

  // ล้างเฉพาะสถานะการตั้งค่า ไม่แตะข้อมูล people/help/statuses
  try{
    if(dbReady) await idbClear("settings");
  }catch(e){
    console.warn("clear settings store", e);
  }

  // ล้างค่าการตั้งค่าที่เก็บไว้เฉพาะเครื่อง
  try{
    localStorage.removeItem(DEVICE_CONFIG_KEY);
  }catch(e){
    console.warn("clear device config", e);
  }

  settings={
    apiUrl:"",
    communities:[],
    types:DEFAULT_TYPES.slice(),
    helps:DEFAULT_HELPS.slice(),
    brandName:DEFAULT_NAME,
    brandSub:DEFAULT_HEADER,
    configured:false,
    cloudEnabled:false,
    theme:"light",
    folderName:"",
    folderHandle:null,
    auth:null
  };

  people=[];
  help=[];
  statuses=[];
  isConfigured=false;
  authenticated=false;
  API_URL="";
  communities=settings.communities;
  types=settings.types;
  helps=settings.helps;
  selectedFolderName="";

  document.documentElement.removeAttribute("data-theme");

  // บันทึกสถานะ "ยังไม่ได้ตั้งค่า" ไว้ เพื่อให้หน้าเว็บรู้ว่าต้องเข้าสู่การตั้งค่า
  await persistSettings();

  updateHeaderUI();
  updateModeUI();
  page="settings";
  render();

  alert(
    "🔄 ล้างการตั้งค่าเครื่องเรียบร้อยแล้ว\n\n"+
    "ตอนนี้สามารถตั้งค่าระบบใหม่ได้ทันที\n\n"+
    "หมายเหตุ: ข้อมูลใน Cloud และไฟล์ Offline เดิมไม่ได้ถูกลบ"
  );
}

function exportCSV(){
let rows=[["ID","คำนำหน้า","ชื่อ","นามสกุล","เลขบัตร","วันเกิด","ที่อยู่","โทรศัพท์","ชุมชน","ประเภท","ระดับ","สถานะ","หมายเหตุ"],...people.map(p=>[p.id,p.prefix,p.first,p.last,p.idcard,p.birth,p.address,p.phone,p.community,(p.types||[]).join(" / "),p.priority,p.status,p.note])];
let csv="\ufeff"+rows.map(r=>r.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(",")).join("\n");let blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="community-care-data.csv";a.click();URL.revokeObjectURL(url)
}
